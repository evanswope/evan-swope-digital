<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7eb3"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Rounded Dark Slate Card Background -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0f172a" stroke="url(#neon-grad)" stroke-width="3"/>
  <!-- Glowing Neon Sparkle / Card Diamond -->
  <path d="M32 14 L38 26 L50 32 L38 38 L32 50 L26 38 L14 32 L26 26 Z" fill="url(#neon-grad)" filter="url(#glow)"/>
</svg>
