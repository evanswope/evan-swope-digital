<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiments | Evan Swope Digital</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="synth.css">
</head>
<body>
  
  <nav class="main-nav">
    <div class="nav-brand">
      <a href="index.html">EvanSwope.</a>
    </div>
    <div class="nav-links">
      <a href="index.html">Work</a>
      <a href="experiments.html" class="active">Experiments</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <main class="main-content">
    <div class="container">
      <header class="section-header fade-in">
        <h1 class="glitch-text" data-text="Lab">Lab</h1>
        <p class="subtitle">Audio / Visual / Interactive</p>
      </header>

      <div class="experiments-grid">
        <section class="experiment-section fade-in">
          
          <!-- SVG Filter for Boiling Effect -->
          <svg width="0" height="0" style="position:absolute;">
            <filter id="boil">
              <feTurbulence id="boil-turbulence" type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise" seed="1"/>
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
            </filter>
          </svg>

          <div class="generative-card">
            <!-- SVG Pink Scribble Overlay -->
            <svg class="pink-scribble" viewBox="0 0 800 200" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M-50,150 Q100,-50 250,120 T500,50 T750,180 T900,20" stroke="#ec4899" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M-20,170 Q120,10 270,140 T520,70 T770,160 T920,40" stroke="#f472b6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <!-- Swirl -->
              <path d="M700,50 C 720,20 780,20 780,60 C 780,100 700,100 700,140 C 700,180 760,180 770,150" stroke="#ec4899" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>

            <div class="card-header">
              <h2 class="card-title">Generative Automata</h2>
              <div class="power-container">
                <button id="btn-start-audio" class="start-btn">POWER <i class="fa-solid fa-power-off"></i></button>
                <div id="power-indicator" class="power-light"></div>
              </div>
            </div>
            
            <div id="grid-container" class="grid-container">
              <div id="audio-start-overlay" class="overlay">
                <p>Initialize Audio Engine</p>
              </div>
              <canvas id="grid-canvas"></canvas>
            </div>
            
            <div class="card-controls">
              
              <div class="playback-controls">
                <button id="btn-play-sim" class="icon-btn" title="Play/Pause"><i class="fa-solid fa-play" id="play-icon"></i></button>
                <button id="btn-random-sim" class="icon-btn" title="Randomize"><i class="fa-solid fa-dice"></i></button>
                <button id="btn-clear-sim" class="icon-btn" title="Clear Grid"><i class="fa-solid fa-trash-can"></i></button>
                <div class="speed-control">
                  <i class="fa-solid fa-gauge-high"></i>
                  <input type="range" id="sim-speed" min="50" max="500" step="10" value="150" class="line-slider">
                </div>
              </div>
              
              <div class="fx-controls">
                <div class="fx-knob-group">
                  <i class="fa-solid fa-water fx-icon" title="Chorus"></i>
                  <input type="range" id="fx-chorus" class="line-slider" min="0" max="1" step="0.01" value="0">
                </div>
                <!-- Swapped Phaser for Distortion -->
                <div class="fx-knob-group">
                  <i class="fa-solid fa-bolt fx-icon" title="Lo-Fi Distortion"></i>
                  <input type="range" id="fx-dist" class="line-slider" min="0" max="1" step="0.01" value="0">
                </div>
                <div class="fx-knob-group">
                  <i class="fa-solid fa-hurricane fx-icon" title="Granular Cloud"></i>
                  <input type="range" id="fx-granular" class="line-slider" min="0" max="1" step="0.01" value="0">
                </div>
              </div>

            </div>
          </div>

        </section>
      </div>
    </div>
  </main>

  <footer class="main-footer">
    <div class="footer-content">
      <p>&copy; 2026 Evan Swope. All rights reserved.</p>
    </div>
  </footer>

  <script src="synth.js"></script>
</body>
</html>
