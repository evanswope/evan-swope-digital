<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiments | Evan Swope Digital</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="synth.css">
</head>
<body>
  <svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false">
    <filter id="scribble-filter" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise">
        <animate attributeName="seed" values="1;2;3;4;5" dur="0.5s" calcMode="discrete" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  
  
    <!-- Navigation Header -->
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo">
        <span class="logo-text">EVAN SWOPE</span>
        <span class="logo-subtext">CREATIVE + STRATEGY</span>
      </a>
      <nav class="nav-links">
        <a href="index.html#work" class="nav-link">Work</a>
        <a href="index.html#resume" class="nav-link">Experience</a>
        <a href="index.html#about" class="nav-link">About</a>
        <a href="experiments.html" class="nav-link">Experiments</a>
        <a href="contact.html" class="nav-link btn-contact">Let's Connect</a>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <header class="section-header fade-in">
        <h1 class="glitch-text" data-text="Lab">Lab</h1>
        <p class="subtitle">Audio / Visual / Interactive</p>
      </header>

      <div class="experiments-grid">
        <section class="experiment-section fade-in">
          
          <!-- SVG Filter for Boiling Effect -->
          

                    
      <div class="carousel-wrapper">
        <button id="carousel-prev" class="carousel-nav-btn"><i class="fa-solid fa-chevron-left"></i></button>
        
        <div class="carousel-viewport">
          <div class="carousel-track" id="carousel-track">
            
            <!-- SLIDE 1: Generative Automata -->
            <div class="carousel-slide">
              <div class="generative-card">
                <svg class="scribble-outline"><rect /></svg>
                <div id="audio-start-overlay" class="card-overlay">
                  <button id="btn-start-audio" class="start-btn large-start">POWER ON <i class="fa-solid fa-power-off"></i></button>
                </div>
                <div class="card-header">
                  <h2 class="card-title">Generative Automata</h2>
                  <div class="power-container">
                    <div id="power-indicator" class="power-light"></div>
                  </div>
                </div>
                <div id="grid-container" class="grid-container">
                  <canvas id="grid-canvas"></canvas>
                </div>
                <div class="card-controls">
                  <div class="playback-controls">
                    <button id="btn-play-sim" class="icon-btn" title="Play/Pause"><i class="fa-solid fa-play" id="play-icon"></i></button>
                    <button id="btn-random-sim" class="icon-btn" title="Randomize"><i class="fa-solid fa-dice"></i></button>
                    <button id="btn-clear-sim" class="icon-btn" title="Clear Grid"><i class="fa-solid fa-trash-can"></i></button>
                    <div class="speed-control">
                      <i class="fa-solid fa-gauge-high"></i>
                      <input type="range" id="sim-speed" min="50" max="500" step="10" value="150" class="line-slider">
                    </div>
                  </div>
                  <div class="fx-controls">
                    <div class="fx-knob-group">
                      <i class="fa-solid fa-water fx-icon" title="Chorus"></i>
                      <input type="range" id="fx-chorus" class="line-slider" min="0" max="1" step="0.01" value="0">
                    </div>
                    <div class="fx-knob-group">
                      <i class="fa-solid fa-bolt fx-icon" title="Lo-Fi Distortion"></i>
                      <input type="range" id="fx-dist" class="line-slider" min="0" max="1" step="0.01" value="0">
                    </div>
                    <div class="fx-knob-group">
                      <i class="fa-solid fa-hurricane fx-icon" title="Granular Cloud"></i>
                      <input type="range" id="fx-granular" class="line-slider" min="0" max="1" step="0.01" value="0">
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- SLIDE 2: Fractal Subtractive Synth -->
            <div class="carousel-slide">
              <div class="generative-card fractal-card">
                <svg class="scribble-outline"><rect /></svg>
                <div id="fractal-overlay" class="card-overlay">
                  <button id="btn-start-fractal" class="start-btn large-start">POWER ON <i class="fa-solid fa-power-off"></i></button>
                </div>
                <div class="card-header">
                  <h2 class="card-title">Fractal Subtractive</h2>
                  <div class="power-container">
                    <div id="fractal-power-indicator" class="power-light"></div>
                  </div>
                </div>
                <div class="grid-container" style="background:#0a0a1a;">
                  <canvas id="fractal-canvas"></canvas>
                </div>
                <div class="card-controls">
                  <div class="playback-controls">
                    <button id="btn-play-fractal" class="icon-btn" title="Trigger Sound"><i class="fa-solid fa-wave-square"></i></button>
                    <div class="fractal-select-wrapper">
                      <select id="fractal-type" class="minimal-select">
                        <option value="mandelbrot">Mandelbrot</option>
                        <option value="julia">Julia</option>
                        <option value="burning">Burning Ship</option>
                      </select>
                    </div>
                  </div>
                  <div class="fx-controls">
                    <div class="fx-knob-group">
                      <span style="color:#64748b; font-size:0.8rem; font-family:var(--font-mono)">ITERATIONS</span>
                      <input type="range" id="fractal-iters" class="line-slider" min="10" max="200" step="1" value="50">
                    </div>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>
        
        <button id="carousel-next" class="carousel-nav-btn"><i class="fa-solid fa-chevron-right"></i></button>
      </div>

</section>
      </div>
    </div>
  </main>

  <footer class="main-footer">
    <div class="footer-content">
      <p>&copy; 2026 Evan Swope. All rights reserved.</p>
    </div>
  </footer>

  <script src="synth.js"></script>
</body>
</html>
