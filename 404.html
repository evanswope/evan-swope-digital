  <script>
    function playThud() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Create an oscillator for the fundamental frequency
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        
        // Create a gain node for the envelope
        const gainNode = audioCtx.createGain();
        
        // Connect nodes
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        const now = audioCtx.currentTime;
        
        // Pitch drop for the "thud" effect
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.5);
        
        // Volume envelope (quick attack, slightly slower decay)
        gainNode.gain.setValueAtTime(0, now);
        gainNode.gain.linearRampToValueAtTime(1, now + 0.02);
        gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
        
        // Add a bit of noise for impact texture
        const bufferSize = audioCtx.sampleRate * 0.5; // 0.5 seconds
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const noiseFilter = audioCtx.createBiquadFilter();
        noiseFilter.type = 'lowpass';
        noiseFilter.frequency.value = 1000;
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(1, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        
        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);
        
        // Start everything
        osc.start(now);
        noise.start(now);
        
        // Stop everything
        osc.stop(now + 0.5);
        noise.stop(now + 0.5);
      } catch (e) {
        console.log("AudioContext blocked or failed", e);
      }
    }

    // Play thud a bit earlier (400ms) to counteract AudioContext initialization latency
    setTimeout(() => {
      playThud();
    }, 400);
    
    // Redirect 4 seconds after text appears (text appears around 1s + 4s = 5s total)
    setTimeout(() => {
      window.location.href = "https://www.evanswope.com";
    }, 5000);
  </script>
