<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Amulet · Resonant Blade</title>
  <meta name="description" content="An alien living monolith. Swipe to cleave. Listen to acoustic beating to fuse." />
  <link rel="icon" type="image/png" href="assets/images/favicon2.png">
  <link rel="apple-touch-icon" href="assets/images/favicon2.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg: #04060c;
    }
    body {
      background-color: var(--bg);
      color: #e2e8f0;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    canvas {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-5 select-none overflow-hidden">
  <!-- Minimal Ethereal Header -->
  <header class="w-full max-w-3xl mx-auto flex items-center justify-between z-10">
    <div class="flex items-center gap-2.5">
      <div id="statusDot" class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></div>
      <span id="headerTitle" class="text-xs sm:text-sm font-semibold tracking-wider uppercase text-slate-300">
        Act I · Cleave (Swipe to Slice)
      </span>
    </div>
    <div class="flex items-center gap-2">
      <button id="soundBtn" type="button" class="px-3 py-1 rounded-full text-xs font-medium border border-cyan-500/30 bg-cyan-500/10 text-cyan-300 hover:bg-cyan-500/20 active:scale-95 transition">
        Sound: On ♪
      </button>
      <button id="resetBtn" type="button" class="px-3 py-1 rounded-full text-xs font-medium border border-slate-700 bg-slate-900/60 text-slate-400 hover:text-white active:scale-95 transition">
        Reset
      </button>
    </div>
  </header>

  <!-- Central Viewport -->
  <main class="relative w-full max-w-3xl mx-auto aspect-[4/3] sm:aspect-[16/10] my-auto flex items-center justify-center">
    <div class="relative w-full h-full rounded-2xl overflow-hidden border border-slate-800/80 bg-[#020409] shadow-2xl">
      <canvas id="glCanvas" class="absolute inset-0 w-full h-full"></canvas>
      <canvas id="hudCanvas" class="absolute inset-0 w-full h-full cursor-crosshair"></canvas>

      <!-- Atmospheric Prompt Overlay -->
      <div id="whisperPrompt" class="pointer-events-none absolute bottom-4 inset-x-0 flex justify-center text-center px-4 transition-opacity duration-500">
        <p id="promptText" class="text-xs sm:text-sm font-light text-slate-400 tracking-wide bg-slate-950/70 border border-slate-800/60 backdrop-blur-md px-4 py-1.5 rounded-full shadow-lg">
          Swipe across the living stone to cleave it in two
        </p>
      </div>

      <!-- Finale Bloom Card -->
      <div id="finalePlaque" class="hidden pointer-events-none absolute inset-0 flex items-center justify-center p-4 z-20">
        <div class="pointer-events-auto max-w-sm w-full bg-slate-950/90 border border-amber-400/40 rounded-2xl p-5 shadow-2xl backdrop-blur-md text-center flex flex-col gap-3">
          <div class="text-[11px] font-semibold uppercase tracking-widest text-amber-300">
            Resynthesized Amulet
          </div>
          <h2 class="text-base sm:text-lg font-bold text-white">
            Harmonic Whole Reborn
          </h2>
          <p class="text-xs text-slate-300 leading-relaxed">
            All 8 severed thought-forms have found their acoustic unisons, welded by gold into a singular singing organism.
          </p>
          <div class="pt-2 flex justify-center">
            <button id="newArtifactBtn" type="button" class="px-4 py-1.5 rounded-full text-xs font-semibold bg-amber-400 text-slate-950 hover:bg-amber-300 active:scale-95 transition">
              Cleave a New Monolith
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Acoustic Whisper Footer -->
  <footer class="w-full max-w-3xl mx-auto flex items-center justify-between text-[11px] sm:text-xs text-slate-500 font-mono z-10">
    <span id="shardsCounter">Shards: 1 / 8</span>
    <span id="acousticHint">Frequency: Fundamental (110 Hz)</span>
  </footer>

  <script>
    (() => {
      const glCanvas = document.getElementById('glCanvas');
      const hudCanvas = document.getElementById('hudCanvas');
      const ctx = hudCanvas.getContext('2d');

      const headerTitle = document.getElementById('headerTitle');
      const statusDot = document.getElementById('statusDot');
      const soundBtn = document.getElementById('soundBtn');
      const resetBtn = document.getElementById('resetBtn');
      const whisperPrompt = document.getElementById('whisperPrompt');
      const promptText = document.getElementById('promptText');
      const shardsCounter = document.getElementById('shardsCounter');
      const acousticHint = document.getElementById('acousticHint');
      const finalePlaque = document.getElementById('finalePlaque');
      const newArtifactBtn = document.getElementById('newArtifactBtn');

      let W = 0, H = 0;
      function resizeCanvases() {
        const rect = glCanvas.getBoundingClientRect();
        W = glCanvas.width = hudCanvas.width = Math.floor(rect.width * window.devicePixelRatio);
        H = glCanvas.height = hudCanvas.height = Math.floor(rect.height * window.devicePixelRatio);
      }
      window.addEventListener('resize', resizeCanvases);

      // =========================================================================
      // 1. WEB AUDIO ENGINE (Tuned Singing Bowls, Overtone Drones & Acoustic Beating)
      // =========================================================================
      let audioCtx = null;
      let audioRunning = false;
      let masterGain = null;
      let reverbBus = null;

      // Harmonic Pitch Bank (A Lydian / Pythagorean Open Tuning)
      const HARMONIC_BANK = [
        { note: 'A2',  freq: 110.0,  label: 'Deep Root' },
        { note: 'E3',  freq: 164.81, label: 'Fifth' },
        { note: 'A3',  freq: 220.0,  label: 'Octave' },
        { note: 'C#4', freq: 277.18, label: 'Third' },
        { note: 'E4',  freq: 329.63, label: 'Ninth' },
        { note: 'G#4', freq: 415.30, label: 'Lydian 7th' },
        { note: 'B4',  freq: 493.88, label: 'Tenth' },
        { note: 'E5',  freq: 659.25, label: 'High Bell' }
      ];

      function buildImpulseResponse(ac) {
        const len = Math.floor(ac.sampleRate * 2.8);
        const buf = ac.createBuffer(2, len, ac.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
          const d = buf.getChannelData(ch);
          for (let i = 0; i < len; i++) {
            const t = i / len;
            d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.5) * (i < 200 ? i / 200 : 1);
          }
        }
        return buf;
      }

      function initAudio() {
        if (audioCtx) {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          audioRunning = true;
          updateSoundBtn();
          return;
        }
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();

        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.75;

        const comp = audioCtx.createDynamicsCompressor();
        comp.threshold.value = -12;
        comp.ratio.value = 4.0;
        masterGain.connect(comp);
        comp.connect(audioCtx.destination);

        const conv = audioCtx.createConvolver();
        conv.buffer = buildImpulseResponse(audioCtx);
        const revGain = audioCtx.createGain();
        revGain.gain.value = 0.85;
        conv.connect(revGain);
        revGain.connect(masterGain);
        reverbBus = { input: conv };

        audioRunning = true;
        updateSoundBtn();
      }

      function updateSoundBtn() {
        if (!audioRunning) {
          soundBtn.textContent = 'Sound: Muted';
          soundBtn.className = 'px-3 py-1 rounded-full text-xs font-medium border border-amber-500/30 bg-amber-500/10 text-amber-300';
        } else {
          soundBtn.textContent = 'Sound: On ♪';
          soundBtn.className = 'px-3 py-1 rounded-full text-xs font-medium border border-cyan-500/30 bg-cyan-500/10 text-cyan-300';
        }
      }

      soundBtn.addEventListener('click', () => {
        if (!audioCtx) initAudio();
        else {
          audioRunning = !audioRunning;
          masterGain.gain.setTargetAtTime(audioRunning ? 0.75 : 0.0001, audioCtx.currentTime, 0.05);
          updateSoundBtn();
        }
      });

      // Sharp crystal strike / singing bowl ping on cut
      function triggerSlashChime(freq = 440) {
        if (!audioCtx || !audioRunning) return;
        const t0 = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const sub = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        const filt = audioCtx.createBiquadFilter();

        osc.type = 'triangle';
        sub.type = 'sine';
        osc.frequency.setValueAtTime(freq * 1.5, t0);
        osc.frequency.exponentialRampToValueAtTime(freq, t0 + 0.08);
        sub.frequency.setValueAtTime(freq * 0.5, t0);

        filt.type = 'lowpass';
        filt.frequency.setValueAtTime(4800, t0);
        filt.frequency.exponentialRampToValueAtTime(800, t0 + 0.4);

        g.gain.setValueAtTime(0.35, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.8);

        osc.connect(filt);
        sub.connect(filt);
        filt.connect(g);
        g.connect(masterGain);
        if (reverbBus) g.connect(reverbBus.input);

        osc.start(t0); sub.start(t0);
        osc.stop(t0 + 0.85); sub.stop(t0 + 0.85);
      }

      // Fusion chime (deep lowpass swell, bass bloom & cathedral shine)
      function triggerFusionBloom(freq = 220) {
        if (!audioCtx || !audioRunning) return;
        const t0 = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        const filt = audioCtx.createBiquadFilter();

        osc1.type = 'sine';
        osc2.type = 'triangle';
        osc1.frequency.setValueAtTime(freq * 0.5, t0);
        osc2.frequency.setValueAtTime(freq * 1.5, t0);
        osc2.frequency.exponentialRampToValueAtTime(freq * 2.0, t0 + 0.2);

        filt.type = 'lowpass';
        filt.frequency.setValueAtTime(250, t0);
        filt.frequency.exponentialRampToValueAtTime(4200, t0 + 0.15);
        filt.frequency.exponentialRampToValueAtTime(650, t0 + 1.2);

        g.gain.setValueAtTime(0.45, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.8);

        osc1.connect(filt);
        osc2.connect(filt);
        filt.connect(g);
        g.connect(masterGain);
        if (reverbBus) g.connect(reverbBus.input);

        osc1.start(t0); osc2.start(t0);
        osc1.stop(t0 + 1.85); osc2.stop(t0 + 1.85);
      }

      // Continuous Drone Voice attached to each shard
      class ShardVoice {
        constructor(freq) {
          this.freq = freq;
          this.active = false;
          this.osc1 = null;
          this.osc2 = null;
          this.vca = null;
          this.filt = null;
        }
        start() {
          if (!audioCtx || this.active) return;
          const t0 = audioCtx.currentTime;
          this.osc1 = audioCtx.createOscillator();
          this.osc2 = audioCtx.createOscillator();
          this.vca = audioCtx.createGain();
          this.filt = audioCtx.createBiquadFilter();

          this.osc1.type = 'triangle';
          this.osc2.type = 'sine';
          this.osc1.frequency.value = this.freq;
          this.osc2.frequency.value = this.freq * 1.002;

          this.filt.type = 'lowpass';
          this.filt.frequency.value = 520;

          this.vca.gain.setValueAtTime(0.0001, t0);
          this.vca.gain.linearRampToValueAtTime(0.14, t0 + 0.3);

          this.osc1.connect(this.filt);
          this.osc2.connect(this.filt);
          this.filt.connect(this.vca);
          this.vca.connect(masterGain);
          if (reverbBus) this.vca.connect(reverbBus.input);

          this.osc1.start(t0);
          this.osc2.start(t0);
          this.active = true;
        }
        setBeatFlutter(beatHz, depth = 0.6) {
          if (!this.vca || !audioCtx) return;
          const now = audioCtx.currentTime;
          if (beatHz > 0.1) {
            // Amplitude fluttering caused by acoustic interference
            const flutter = 1.0 - (0.5 * depth * (1 + Math.sin(now * beatHz * 6.28)));
            this.vca.gain.setTargetAtTime(0.16 * flutter, now, 0.03);
            this.filt.frequency.setTargetAtTime(450 + (1 - depth) * 700, now, 0.04);
          } else {
            // Calm, open harmonic lock!
            this.vca.gain.setTargetAtTime(0.24, now, 0.05);
            this.filt.frequency.setTargetAtTime(1450, now, 0.05);
          }
        }
        stop() {
          if (!this.active) return;
          const t0 = audioCtx.currentTime;
          this.vca.gain.setTargetAtTime(0.0001, t0, 0.1);
          setTimeout(() => {
            try {
              this.osc1.stop(); this.osc2.stop();
              this.osc1.disconnect(); this.osc2.disconnect();
              this.vca.disconnect();
            } catch (_) {}
          }, 150);
          this.active = false;
        }
      }

      // =========================================================================
      // 2. 3D MATH & WATERTIGHT MESH SLICING
      // =========================================================================
      const v3 = {
        add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
        sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
        scale: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
        dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
        cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
        norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
        dist: (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2])
      };

      const quat = {
        identity: () => [0, 0, 0, 1],
        fromAxisAngle: (axis, rad) => {
          const h = rad * 0.5, s = Math.sin(h), n = v3.norm(axis);
          return [n[0] * s, n[1] * s, n[2] * s, Math.cos(h)];
        },
        mul: (a, b) => [
          a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
          a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
          a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
          a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2]
        ],
        norm: (q) => { const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1; return [q[0] / l, q[1] / l, q[2] / l, q[3] / l]; },
        rotateVec: (q, v) => {
          const ux = q[0], uy = q[1], uz = q[2], s = q[3];
          const dUV = ux * v[0] + uy * v[1] + uz * v[2];
          const dUU = ux * ux + uy * uy + uz * uz;
          const cx = uy * v[2] - uz * v[1], cy = uz * v[0] - ux * v[2], cz = ux * v[1] - uy * v[0];
          return [ux * 2 * dUV + v[0] * (s * s - dUU) + cx * 2 * s,
                  uy * 2 * dUV + v[1] * (s * s - dUU) + cy * 2 * s,
                  uz * 2 * dUV + v[2] * (s * s - dUU) + cz * 2 * s];
        },
        rotateVecInv: (q, v) => quat.rotateVec([-q[0], -q[1], -q[2], q[3]], v),
        angleBetween: (q1, q2) => {
          const d = Math.abs(q1[0]*q2[0] + q1[1]*q2[1] + q1[2]*q2[2] + q1[3]*q2[3]);
          return 2 * Math.acos(Math.min(1.0, d));
        }
      };

      function mat4Perspective(fovY, aspect, near, far) {
        const f = 1 / Math.tan(fovY * 0.5), nf = 1 / (near - far);
        return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]);
      }

      function mat4LookAt(eye, center, up) {
        const z = v3.norm(v3.sub(eye, center)), x = v3.norm(v3.cross(up, z)), y = v3.cross(z, x);
        return new Float32Array([x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -v3.dot(x, eye), -v3.dot(y, eye), -v3.dot(z, eye), 1]);
      }

      function mat4Mul(a, b) {
        const o = new Float32Array(16);
        for (let c = 0; c < 4; c++) {
          for (let r = 0; r < 4; r++) {
            o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
          }
        }
        return o;
      }

      function mat4FromPosQuatScale(pos, q, sc) {
        const x = q[0], y = q[1], z = q[2], w = q[3];
        const x2 = x + x, y2 = y + y, z2 = z + z;
        return new Float32Array([
          (1 - (y * y2 + z * z2)) * sc, (x * y2 + w * z2) * sc, (x * z2 - w * y2) * sc, 0,
          (x * y2 - w * z2) * sc, (1 - (x * x2 + z * z2)) * sc, (y * z2 + w * x2) * sc, 0,
          (x * z2 + w * y2) * sc, (y * z2 - w * x2) * sc, (1 - (x * x2 + y * y2)) * sc, 0,
          pos[0], pos[1], pos[2], 1
        ]);
      }

      function projectPoint(wp, vp) {
        const cx = vp[0] * wp[0] + vp[4] * wp[1] + vp[8] * wp[2] + vp[12];
        const cy = vp[1] * wp[0] + vp[5] * wp[1] + vp[9] * wp[2] + vp[13];
        const cw = vp[3] * wp[0] + vp[7] * wp[1] + vp[11] * wp[2] + vp[15];
        if (cw <= 0.01) return null;
        return { x: (cx / cw * 0.5 + 0.5) * W, y: (0.5 - cy / cw * 0.5) * H };
      }

      // Procedural Living Monolith Base (Organic Undulating Polyhedron)
      function createLivingMonolith() {
        const t = (1 + Math.sqrt(5)) / 2;
        let verts = [
          [-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],
          [0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]
        ].map(v => v3.norm(v));
        let faces = [
          [0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
          [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]
        ];

        // Subdivide 2 times for organic crystalline resolution
        for (let s = 0; s < 2; s++) {
          const mc = new Map();
          const mid = (a, b) => {
            const k = a < b ? `${a}_${b}` : `${b}_${a}`;
            if (mc.has(k)) return mc.get(k);
            const idx = verts.length;
            verts.push(v3.norm(v3.add(verts[a], verts[b])));
            mc.set(k, idx);
            return idx;
          };
          const nf = [];
          for (const [a, b, c] of faces) {
            const ab = mid(a, b), bc = mid(b, c), ca = mid(c, a);
            nf.push([a, ab, ca], [b, bc, ab], [c, ca, bc], [ab, bc, ca]);
          }
          faces = nf;
        }

        return {
          vertices: verts.map(u => {
            const r = 1.15 + 0.12 * Math.sin(u[0] * 3.5) * Math.cos(u[1] * 2.8);
            const p = [u[0] * r, u[1] * r * 1.15, u[2] * r * 0.95];
            return { pos: p, prim: [...u] };
          }),
          faces
        };
      }

      // Fast watertight 3D plane bisection
      function clipMeshByPlane(mesh, rawNormal) {
        const n = v3.norm(rawNormal);
        const verts = mesh.vertices;
        const dists = verts.map(v => {
          let d = v3.dot(n, v.pos);
          if (Math.abs(d) < 1e-5) d = d >= 0 ? 1e-5 : -1e-5;
          return d;
        });

        const pV = [], nV = [], pM = new Map(), nM = new Map(), pE = new Map(), nE = new Map();
        const pF = [], nF = [], segs = [];

        const getO = (i, isP) => {
          const m = isP ? pM : nM, a = isP ? pV : nV;
          if (m.has(i)) return m.get(i);
          const s = verts[i], ni = a.length;
          a.push({ pos: [...s.pos], prim: [...s.prim] });
          m.set(i, ni);
          return ni;
        };

        const getC = (iA, iB, isP) => {
          const c = isP ? pE : nE, a = isP ? pV : nV;
          const k = iA < iB ? `${iA}_${iB}` : `${iB}_${iA}`;
          if (c.has(k)) return c.get(k);
          const t = dists[iA] / (dists[iA] - dists[iB]);
          const pos = v3.add(verts[iA].pos, v3.scale(v3.sub(verts[iB].pos, verts[iA].pos), t));
          const prim = [5.0, 5.0, 5.0]; // Mark cut-cap vertices for glowing gold/inner crystal grain!
          const ni = a.length;
          a.push({ pos, prim });
          c.set(k, ni);
          return ni;
        };

        for (const [i0, i1, i2] of mesh.faces) {
          const s0 = dists[i0] >= 0, s1 = dists[i1] >= 0, s2 = dists[i2] >= 0;
          const cnt = (s0 ? 1 : 0) + (s1 ? 1 : 0) + (s2 ? 1 : 0);
          if (cnt === 3) pF.push([getO(i0, true), getO(i1, true), getO(i2, true)]);
          else if (cnt === 0) nF.push([getO(i0, false), getO(i1, false), getO(i2, false)]);
          else {
            let iA = i0, iB = i1, iC = i2, aP = s0;
            if (s1 === s2 && s0 !== s1) { iA = i0; iB = i1; iC = i2; aP = s0; }
            else if (s0 === s2 && s1 !== s0) { iA = i1; iB = i2; iC = i0; aP = s1; }
            else { iA = i2; iB = i0; iC = i1; aP = s2; }
            const abP = getC(iA, iB, true), caP = getC(iC, iA, true);
            const abN = getC(iA, iB, false), caN = getC(iC, iA, false);
            if (aP) {
              pF.push([getO(iA, true), abP, caP]);
              nF.push([abN, getO(iB, false), getO(iC, false)], [abN, getO(iC, false), caN]);
              segs.push({ p1: abP, p2: caP, n1: abN, n2: caN });
            } else {
              nF.push([getO(iA, false), abN, caN]);
              pF.push([abP, getO(iB, true), getO(iC, true)], [abP, getO(iC, true), caP]);
              segs.push({ p1: caP, p2: abP, n1: caN, n2: abN });
            }
          }
        }
        if (pV.length < 4 || nV.length < 4 || segs.length < 3) return null;

        let capCenter = [0, 0, 0];
        for (const sg of segs) capCenter = v3.add(capCenter, pV[sg.p1].pos);
        capCenter = v3.scale(capCenter, 1 / segs.length);

        const ciP = pV.length; pV.push({ pos: [...capCenter], prim: [5, 5, 5] });
        const ciN = nV.length; nV.push({ pos: [...capCenter], prim: [5, 5, 5] });

        for (const sg of segs) {
          pF.push([ciP, sg.p2, sg.p1]);
          nF.push([ciN, sg.n1, sg.n2]);
        }

        return {
          posMesh: { vertices: pV, faces: pF },
          negMesh: { vertices: nV, faces: nF },
          cutNormal: [...n],
          cutCenter: capCenter
        };
      }

      // =========================================================================
      // 3. WEBGL SHADER (Living Mercury / Crystalline Inner Core / Kintsugi Seam)
      // =========================================================================
      const gl = glCanvas.getContext('webgl', { antialias: true, alpha: false });

      const VS_SRC = `
        attribute vec3 aPos;
        attribute vec3 aNormal;
        attribute vec3 aPrim;

        uniform mat4 uModel;
        uniform mat4 uViewProj;
        uniform float uTime;
        uniform float uGlow;

        varying vec3 vWorldPos;
        varying vec3 vNormal;
        varying vec3 vPrim;
        varying float vGlow;

        void main() {
          vec3 p = aPos;
          float isCap = step(4.0, aPrim.x);
          // Organic breathing undulation
          if (isCap < 0.5) {
            float wave = sin(uTime * 2.2 + aPrim.x * 4.0 + aPrim.y * 3.0) * 0.015;
            p += aNormal * wave;
          }
          vec4 wp = uModel * vec4(p, 1.0);
          vWorldPos = wp.xyz;
          vNormal = normalize((uModel * vec4(aNormal, 0.0)).xyz);
          vPrim = aPrim;
          vGlow = uGlow;
          gl_Position = uViewProj * wp;
        }
      `;

      const FS_SRC = `
        precision highp float;

        varying vec3 vWorldPos;
        varying vec3 vNormal;
        varying vec3 vPrim;
        varying float vGlow;

        uniform vec3 uCamPos;
        uniform float uTime;

        void main() {
          vec3 N = normalize(vNormal);
          vec3 V = normalize(uCamPos - vWorldPos);
          vec3 L1 = normalize(vec3(0.5, 0.85, 0.65));
          vec3 L2 = normalize(vec3(-0.6, -0.2, 0.7));

          float diff1 = max(0.0, dot(N, L1));
          float diff2 = max(0.0, dot(N, L2)) * 0.35;
          vec3 H1 = normalize(L1 + V);
          float spec = pow(max(0.0, dot(N, H1)), 64.0);
          float fresnel = pow(1.0 - max(0.0, dot(N, V)), 2.6);

          if (vPrim.x > 4.0) {
            // Cut face: inner glowing gold / opalescent crystalline core!
            vec3 coreGold = vec3(1.0, 0.82, 0.32) * (0.6 + diff1 * 0.6)
                          + vec3(1.0, 0.98, 0.88) * spec * 1.5
                          + vec3(1.0, 0.65, 0.1) * (0.5 + 0.5 * sin(uTime * 4.0 + vWorldPos.x * 10.0)) * 0.35
                          + vec3(1.0, 0.9, 0.5) * vGlow * 1.2;
            gl_FragColor = vec4(coreGold, 1.0);
            return;
          }

          // Alien Living Mercury / Obsidian Exterior
          vec3 baseCol = vec3(0.12, 0.16, 0.24);
          vec3 irid = 0.5 + 0.5 * cos(6.28318 * (fresnel * 0.75 + vec3(0.0, 0.33, 0.67) + uTime * 0.05));
          vec3 col = baseCol * (0.3 + diff1 * 0.7 + diff2)
                   + vec3(1.0, 0.98, 0.95) * spec * 0.85
                   + irid * fresnel * 0.45
                   + vec3(0.2, 0.7, 0.9) * vGlow * 0.6;

          gl_FragColor = vec4(col, 1.0);
        }
      `;

      function compileSh(t, s) { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); return sh; }
      const prog = gl.createProgram();
      gl.attachShader(prog, compileSh(gl.VERTEX_SHADER, VS_SRC));
      gl.attachShader(prog, compileSh(gl.FRAGMENT_SHADER, FS_SRC));
      gl.linkProgram(prog); gl.useProgram(prog);

      const loc = {
        aPos: gl.getAttribLocation(prog, 'aPos'),
        aNormal: gl.getAttribLocation(prog, 'aNormal'),
        aPrim: gl.getAttribLocation(prog, 'aPrim'),
        uModel: gl.getUniformLocation(prog, 'uModel'),
        uViewProj: gl.getUniformLocation(prog, 'uViewProj'),
        uCamPos: gl.getUniformLocation(prog, 'uCamPos'),
        uTime: gl.getUniformLocation(prog, 'uTime'),
        uGlow: gl.getUniformLocation(prog, 'uGlow')
      };

      function uploadMeshBuffer(piece) {
        const verts = piece.mesh.vertices, faces = piece.mesh.faces;
        const sN = verts.map(() => [0, 0, 0]);
        for (const [i0, i1, i2] of faces) {
          const fn = v3.norm(v3.cross(v3.sub(verts[i1].pos, verts[i0].pos), v3.sub(verts[i2].pos, verts[i0].pos)));
          sN[i0] = v3.add(sN[i0], fn); sN[i1] = v3.add(sN[i1], fn); sN[i2] = v3.add(sN[i2], fn);
        }
        for (let i = 0; i < sN.length; i++) sN[i] = v3.norm(sN[i]);

        const data = new Float32Array(faces.length * 3 * 9);
        let ptr = 0;
        for (let f = 0; f < faces.length; f++) {
          for (let k = 0; k < 3; k++) {
            const vi = faces[f][k], v = verts[vi], n = sN[vi];
            data[ptr++] = v.pos[0];  data[ptr++] = v.pos[1];  data[ptr++] = v.pos[2];
            data[ptr++] = n[0];      data[ptr++] = n[1];      data[ptr++] = n[2];
            data[ptr++] = v.prim[0]; data[ptr++] = v.prim[1]; data[ptr++] = v.prim[2];
          }
        }

        if (!piece.glBuffer) piece.glBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, piece.glBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
        piece.vertCount = faces.length * 3;
      }

      // =========================================================================
      // 4. SHARD OBJECTS & STATE
      // =========================================================================
      let phase = 'cut'; // 'cut' (1 -> 8) | 'glue' (8 -> 1) | 'finale'
      let pieces = [];
      let heldPiece = null;
      let targetGluePair = null; // [pieceA, pieceB]
      let currentViewProj = mat4Perspective(Math.PI / 4.2, 1.0, 0.1, 30);
      let nextVoiceIdx = 0;

      function createShard(mesh, pos = [0, 0, 0], quatInit = quat.identity()) {
        const hDef = HARMONIC_BANK[nextVoiceIdx % HARMONIC_BANK.length];
        nextVoiceIdx++;
        const voice = new ShardVoice(hDef.freq);

        const shard = {
          id: Math.random().toString(36).slice(2, 8),
          mesh,
          pos: [...pos],
          targetPos: [...pos],
          vel: [0, 0, 0],
          quat: [...quatInit],
          targetQuat: [...quatInit],
          scale: 1.0,
          targetScale: 1.0,
          voice,
          note: hDef.note,
          freq: hDef.freq,
          glow: 0.0,
          glBuffer: null,
          vertCount: 0
        };
        uploadMeshBuffer(shard);
        return shard;
      }

      function initMonolith() {
        for (const p of pieces) {
          if (p.voice) p.voice.stop();
          if (p.glBuffer) gl.deleteBuffer(p.glBuffer);
        }
        pieces = [];
        nextVoiceIdx = 0;
        phase = 'cut';
        targetGluePair = null;
        heldPiece = null;
        finalePlaque.classList.add('hidden');
        whisperPrompt.classList.remove('opacity-0');

        const baseMesh = createLivingMonolith();
        const monolith = createShard(baseMesh, [0, 0, 0]);
        pieces = [monolith];

        headerTitle.textContent = 'Act I · Cleave (Swipe to Slice)';
        statusDot.className = 'w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse';
        promptText.textContent = 'Swipe across the living stone to cleave it in two';
        shardsCounter.textContent = 'Shards: 1 / 8';
        acousticHint.textContent = `Frequency: Root (${monolith.note})`;

        if (audioRunning) monolith.voice.start();
      }

      resetBtn.addEventListener('click', initMonolith);
      newArtifactBtn.addEventListener('click', initMonolith);

      // =========================================================================
      // 5. FRUIT NINJA SWIPE CUT ENGINE (Act I)
      // =========================================================================
      let swipeStart = null;
      let swipeCurrent = null;
      let swipePoints = [];

      function executeCut(p1, p2) {
        initAudio();
        const dx = p2.x - p1.x, dy = p2.y - p1.y;
        const len = Math.hypot(dx, dy);
        if (len < 30 * window.devicePixelRatio) return;

        // Cut plane in camera space: perpendicular to the swipe direction
        const cutNormalCam = v3.norm([-(p2.y - p1.y), -(p2.x - p1.x), 0]);

        // Find which piece the swipe line passes through
        const midX = (p1.x + p2.x) * 0.5, midY = (p1.y + p2.y) * 0.5;
        let targetPiece = null, minDist = 180 * window.devicePixelRatio;

        for (const p of pieces) {
          const sc = projectPoint(p.pos, currentViewProj);
          if (sc) {
            const d = Math.hypot(sc.x - midX, sc.y - midY);
            if (d < minDist) { minDist = d; targetPiece = p; }
          }
        }

        if (!targetPiece) return;

        // Transform cut normal into piece's local coordinates
        const localCutNorm = v3.norm(quat.rotateVecInv(targetPiece.quat, cutNormalCam));
        const res = clipMeshByPlane(targetPiece.mesh, localCutNorm);
        if (!res) return;

        triggerSlashChime(targetPiece.freq * 1.5);

        // Displace the two halves apart along the cut plane normal
        const worldN = quat.rotateVec(targetPiece.quat, localCutNorm);
        const impulse = 0.32;
        const pPos = v3.add(targetPiece.pos, v3.scale(worldN, impulse));
        const pNeg = v3.add(targetPiece.pos, v3.scale(worldN, -impulse));

        const shardA = createShard(res.posMesh, pPos, targetPiece.quat);
        const shardB = createShard(res.negMesh, pNeg, targetPiece.quat);

        targetPiece.voice.stop();
        if (targetPiece.glBuffer) gl.deleteBuffer(targetPiece.glBuffer);

        const idx = pieces.indexOf(targetPiece);
        pieces.splice(idx, 1, shardA, shardB);

        if (audioRunning) {
          shardA.voice.start();
          shardB.voice.start();
        }

        shardsCounter.textContent = `Shards: ${pieces.length} / 8`;
        acousticHint.textContent = `Voices: ${pieces.map(p => p.note).join(' · ')}`;

        if (pieces.length >= 8) {
          // Transition to Act II: Resonant Glue!
          phase = 'glue';
          headerTitle.textContent = 'Act II · Resynthesize (Bring Shards Together)';
          statusDot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse';
          promptText.innerHTML = `Drag shards together · <strong class="text-amber-400">Twist to slow the acoustic beating</strong>`;

          // Arrange shards gently in an open zero-g floating ring
          pieces.forEach((p, i) => {
            const angle = (i * Math.PI * 2) / pieces.length;
            p.targetPos = [Math.cos(angle) * 1.5, Math.sin(angle) * 0.9, (Math.random() - 0.5) * 0.4];
          });
        }
      }

      // =========================================================================
      // 6. RESONANT BEATING & MAGNETIC FUSION ENGINE (Act II)
      // =========================================================================
      function findClosestPair() {
        let bestPair = null, minD = 1e9;
        for (let i = 0; i < pieces.length; i++) {
          for (let j = i + 1; j < pieces.length; j++) {
            const d = v3.dist(pieces[i].pos, pieces[j].pos);
            if (d < minD) { minD = d; bestPair = [pieces[i], pieces[j]]; }
          }
        }
        return { pair: bestPair, dist: minD };
      }

      function updateAcousticBeating() {
        if (phase !== 'glue') return;

        const { pair, dist } = findClosestPair();
        if (!pair || dist > 1.4) {
          // No shards near each other: steady calm drones
          for (const p of pieces) {
            p.voice.setBeatFlutter(0, 0);
            p.glow = 0;
          }
          acousticHint.textContent = 'Drag two shards close to listen';
          return;
        }

        const [pA, pB] = pair;
        // Angular misalignment between the two pieces
        const angleErr = quat.angleBetween(pA.quat, pB.quat); // in radians [0..PI]

        // Frequency beating speeds up with angular misalignment and slows to 0 at unison!
        const beatHz = Math.max(0.0, Math.min(14.0, (angleErr / Math.PI) * 12.0));
        const closeness = Math.max(0.0, 1.0 - (dist / 1.4));

        pA.voice.setBeatFlutter(beatHz, closeness * 0.85);
        pB.voice.setBeatFlutter(beatHz, closeness * 0.85);

        // Glow surges as beating approaches 0 (consonance!)
        const consonance = Math.max(0, 1.0 - (beatHz / 3.0));
        pA.glow = closeness * consonance;
        pB.glow = closeness * consonance;

        if (beatHz > 0.8) {
          acousticHint.textContent = `Beating: ${beatHz.toFixed(1)} Hz (Twist to align)`;
        } else {
          acousticHint.textContent = `Harmonic Unison! Release to fuse`;
        }

        // SNAP & FUSE: When very close AND beating settles into harmonic unison!
        if (dist < 0.55 && beatHz < 0.75 && !heldPiece) {
          fuseShards(pA, pB);
        }
      }

      function fuseShards(pA, pB) {
        triggerFusionBloom(pA.freq);

        // Merge both mesh geometries with golden Kintsugi weld seam
        const verts = [], faces = [];
        const append = (p) => {
          const base = verts.length;
          for (const v of p.mesh.vertices) {
            const r = quat.rotateVec(p.quat, v.pos);
            const wp = v3.add(p.pos, r);
            verts.push({ pos: wp, prim: [...v.prim] });
          }
          for (const [a, b, c] of p.mesh.faces) faces.push([base + a, base + b, base + c]);
        };
        append(pA);
        append(pB);

        // Center the composite
        let c = [0, 0, 0];
        for (const v of verts) c = v3.add(c, v.pos);
        c = v3.scale(c, 1 / verts.length);
        for (const v of verts) v.pos = v3.sub(v.pos, c);

        pA.voice.stop();
        pB.voice.stop();
        if (pA.glBuffer) gl.deleteBuffer(pA.glBuffer);
        if (pB.glBuffer) gl.deleteBuffer(pB.glBuffer);

        pieces = pieces.filter(p => p !== pA && p !== pB);

        const fused = createShard({ vertices: verts, faces }, c, quat.identity());
        fused.glow = 1.0;
        pieces.push(fused);
        if (audioRunning) fused.voice.start();

        shardsCounter.textContent = `Shards: ${pieces.length} / 8`;

        if (pieces.length === 1) {
          // FINALE! Reunited into 1
          phase = 'finale';
          headerTitle.textContent = 'Harmonic Amulet · Resynthesized';
          statusDot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse';
          promptText.textContent = 'Drag to spin your resurrected singing amulet';
          finalePlaque.classList.remove('hidden');
          pieces[0].targetPos = [0, 0, 0];
        }
      }

      // =========================================================================
      // 7. TOUCH / POINTER GESTURES
      // =========================================================================
      function getPt(e) {
        const r = hudCanvas.getBoundingClientRect();
        return {
          x: ((e.clientX - r.left) / r.width) * W,
          y: ((e.clientY - r.top) / r.height) * H
        };
      }

      hudCanvas.addEventListener('pointerdown', (e) => {
        initAudio();
        const pt = getPt(e);
        try { hudCanvas.setPointerCapture(e.pointerId); } catch (_) {}

        if (phase === 'cut') {
          // Act I: Begin Fruit Ninja slice gesture
          swipeStart = { ...pt };
          swipeCurrent = { ...pt };
          swipePoints = [{ ...pt, time: performance.now() }];
        } else {
          // Act II / Finale: Grab shard to move or rotate
          let hit = null, minD = 80 * window.devicePixelRatio;
          for (const p of pieces) {
            const sc = projectPoint(p.pos, currentViewProj);
            if (sc) {
              const d = Math.hypot(sc.x - pt.x, sc.y - pt.y);
              if (d < minD) { minD = d; hit = p; }
            }
          }
          heldPiece = hit;
          swipeStart = { ...pt };
        }
      });

      hudCanvas.addEventListener('pointermove', (e) => {
        const pt = getPt(e);

        if (phase === 'cut' && swipeStart) {
          swipeCurrent = { ...pt };
          swipePoints.push({ ...pt, time: performance.now() });
          if (swipePoints.length > 16) swipePoints.shift();
        } else if (heldPiece) {
          const dx = (pt.x - swipeStart.x) / W;
          const dy = (pt.y - swipeStart.y) / H;
          swipeStart = { ...pt };

          if (phase === 'glue') {
            // Drag moves piece in 3D, and twisting near another piece rotates its orientation!
            heldPiece.pos[0] += dx * 3.8;
            heldPiece.pos[1] -= dy * 3.8;

            // Rotation twist: drag distance rotates quat so player can tune frequency beating!
            const qTurn = quat.fromAxisAngle([dy, dx, (dx + dy) * 0.5], Math.hypot(dx, dy) * 0.04);
            heldPiece.quat = quat.norm(quat.mul(qTurn, heldPiece.quat));
          } else if (phase === 'finale') {
            // Spin the final amulet
            const qTurn = quat.fromAxisAngle([dy, dx, 0], Math.hypot(dx, dy) * 0.02);
            heldPiece.quat = quat.norm(quat.mul(qTurn, heldPiece.quat));
          }
        }
      });

      window.addEventListener('pointerup', () => {
        if (phase === 'cut' && swipeStart && swipeCurrent) {
          executeCut(swipeStart, swipeCurrent);
        }
        swipeStart = null;
        swipeCurrent = null;
        swipePoints = [];
        heldPiece = null;
      });

      // =========================================================================
      // 8. RENDER LOOP
      // =========================================================================
      let lastTime = performance.now();

      function render(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        updateAcousticBeating();

        // Zero-G Physics: pieces gently float toward targetPos & damping
        for (const p of pieces) {
          p.pos = v3.add(p.pos, v3.scale(v3.sub(p.targetPos, p.pos), Math.min(1, dt * 4.5)));
          if (phase === 'cut' && !heldPiece) {
            const qFloat = quat.fromAxisAngle([0.1, 1, 0.05], dt * 0.25);
            p.quat = quat.norm(quat.mul(qFloat, p.quat));
          }
          p.glow = Math.max(0, p.glow - dt * 2.0);
        }

        const camPos = [0, 0.1, 4.6];
        const proj = mat4Perspective(Math.PI / 4.2, W / H, 0.1, 30);
        const view = mat4LookAt(camPos, [0, 0, 0], [0, 1, 0]);
        currentViewProj = mat4Mul(proj, view);

        // 1. WebGL 3D Render
        gl.viewport(0, 0, W, H);
        gl.clearColor(0.015, 0.022, 0.04, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        gl.enable(gl.DEPTH_TEST);
        gl.useProgram(prog);

        gl.uniformMatrix4fv(loc.uViewProj, false, currentViewProj);
        gl.uniform3fv(loc.uCamPos, camPos);
        gl.uniform1f(loc.uTime, now * 0.001);

        const stride = 9 * 4;
        for (const p of pieces) {
          if (!p.glBuffer) uploadMeshBuffer(p);
          const model = mat4FromPosQuatScale(p.pos, p.quat, p.scale);
          gl.uniformMatrix4fv(loc.uModel, false, model);
          gl.uniform1f(loc.uGlow, p.glow);

          gl.bindBuffer(gl.ARRAY_BUFFER, p.glBuffer);
          gl.enableVertexAttribArray(loc.aPos);
          gl.vertexAttribPointer(loc.aPos, 3, gl.FLOAT, false, stride, 0);
          gl.enableVertexAttribArray(loc.aNormal);
          gl.vertexAttribPointer(loc.aNormal, 3, gl.FLOAT, false, stride, 3 * 4);
          gl.enableVertexAttribArray(loc.aPrim);
          gl.vertexAttribPointer(loc.aPrim, 3, gl.FLOAT, false, stride, 6 * 4);

          gl.drawArrays(gl.TRIANGLES, 0, p.vertCount);
        }

        // 2. 2D HUD (Laser Blade Trail & Acoustic Interference Halo)
        ctx.clearRect(0, 0, W, H);

        // Render Fruit Ninja blade slash trail
        if (phase === 'cut' && swipePoints.length > 1) {
          ctx.beginPath();
          ctx.moveTo(swipePoints[0].x, swipePoints[0].y);
          for (let i = 1; i < swipePoints.length; i++) {
            ctx.lineTo(swipePoints[i].x, swipePoints[i].y);
          }
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.lineWidth = 4 * window.devicePixelRatio;
          ctx.lineCap = 'round';
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 16 * window.devicePixelRatio;
          ctx.stroke();
          ctx.shadowBlur = 0;
        }

        // Render Acoustic Resonance Rings between interacting shards in Act II
        if (phase === 'glue') {
          const { pair, dist } = findClosestPair();
          if (pair && dist < 1.4) {
            const [pA, pB] = pair;
            const scA = projectPoint(pA.pos, currentViewProj);
            const scB = projectPoint(pB.pos, currentViewProj);

            if (scA && scB) {
              const midX = (scA.x + scB.x) * 0.5;
              const midY = (scA.y + scB.y) * 0.5;
              const r = Math.max(12, dist * 60 * window.devicePixelRatio);

              ctx.beginPath();
              ctx.arc(midX, midY, r, 0, Math.PI * 2);
              ctx.strokeStyle = `rgba(245, 158, 11, ${Math.max(0.2, pA.glow)})`;
              ctx.lineWidth = (2 + pA.glow * 4) * window.devicePixelRatio;
              ctx.stroke();

              ctx.beginPath();
              ctx.moveTo(scA.x, scA.y);
              ctx.lineTo(scB.x, scB.y);
              ctx.strokeStyle = `rgba(56, 189, 248, ${0.3 + pA.glow * 0.5})`;
              ctx.setLineDash([6, 6]);
              ctx.stroke();
              ctx.setLineDash([]);
            }
          }
        }

        requestAnimationFrame(render);
      }

      resizeCanvases();
      initMonolith();
      requestAnimationFrame(render);
    })();
  </script>
