<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>The Vessel · A Meditation on Integration</title>
  <meta name="description" content="A mind broken is not ruined; it has differentiated into its true voices. Gather the shards, mend the seams with gold, and listen to them sing." />
  <link rel="icon" type="image/png" href="assets/images/favicon2.png">
  <link rel="apple-touch-icon" href="assets/images/favicon2.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg: #06080e;
    }
    body {
      background-color: var(--bg);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
    }
    canvas {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .gold-glow {
      text-shadow: 0 0 16px rgba(255, 210, 77, 0.45);
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-4 sm:p-6 select-none overflow-hidden relative">

  <!-- Background Ambient Glow -->
  <div class="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,_rgba(30,41,59,0.35)_0%,_transparent_75%)] opacity-80 z-0"></div>

  <!-- Header HUD -->
  <header class="w-full max-w-2xl mx-auto flex items-center justify-between z-10 relative">
    <div class="flex items-center gap-3">
      <div id="statusDot" class="w-2.5 h-2.5 rounded-full bg-amber-400 shadow-[0_0_8px_#f59e0b] animate-pulse"></div>
      <div>
        <h1 id="actTitle" class="text-xs sm:text-sm font-semibold tracking-widest uppercase text-amber-200/90 gold-glow">
          The Vessel · Unbroken
        </h1>
        <p id="actSubtitle" class="text-[11px] text-slate-400 font-light">
          Tap the stone to awaken
        </p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="soundBtn" type="button" class="px-3 py-1 rounded-full text-xs font-medium border border-amber-500/30 bg-amber-500/10 text-amber-300 hover:bg-amber-500/20 active:scale-95 transition">
        Sound: On ♫
      </button>
      <button id="resetBtn" type="button" class="px-3 py-1 rounded-full text-xs font-medium border border-slate-700/80 bg-slate-900/80 text-slate-400 hover:text-white active:scale-95 transition">
        Reset
      </button>
      <a href="index.html" class="px-3 py-1 rounded-full text-xs font-medium border border-slate-800 bg-slate-950/60 text-slate-400 hover:text-slate-200 active:scale-95 transition hidden sm:inline-block">
        Portfolio ↗
      </a>
    </div>
  </header>

  <!-- 3D Canvas Viewport -->
  <div class="relative w-full flex-1 flex items-center justify-center z-0">
    <canvas id="glCanvas" class="w-full h-full block"></canvas>

    <!-- Shard Whisper Card (shows archetype name and poetic meaning) -->
    <div id="shardWhisper" class="absolute top-6 pointer-events-none text-center px-4 py-2 rounded-full bg-slate-950/80 border border-slate-800/80 backdrop-blur-md opacity-0 transition-opacity duration-300 shadow-2xl">
      <span id="whisperName" class="text-xs font-semibold uppercase tracking-wider text-amber-300">Grief</span>
      <span class="text-slate-500 mx-1.5">·</span>
      <span id="whisperLore" class="text-xs text-slate-300 italic">The deep well that holds our ground</span>
    </div>

    <!-- Acoustic Detune / Beating Indicator -->
    <div id="beatingPill" class="absolute bottom-8 pointer-events-none flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-950/85 border border-amber-500/40 backdrop-blur-md opacity-0 transition-opacity duration-200 shadow-xl">
      <div id="beatingWave" class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></div>
      <span id="beatingText" class="text-[11px] text-amber-200/90 font-mono tracking-wide">Acoustic Beating: Slowing...</span>
    </div>
  </div>

  <!-- Bottom Guidance Prompt -->
  <footer class="w-full max-w-xl mx-auto text-center z-10 relative pb-1 sm:pb-3">
    <p id="footerHint" class="text-xs sm:text-sm text-slate-400/90 font-light tracking-wide transition-all duration-500">
      "Before the fracture, there was only silence."
    </p>
  </footer>

  <script>
    // --- NARRATIVE DATA FOR THE 4 EMOTIONAL FACETS ---
    const SHARDS_INFO = [
      {
        id: 0,
        name: "Grief",
        title: "The Deep Well",
        lore: "The weight that anchors us to reality.",
        colorHex: 0x223572, // Deep cobalt / lapis
        emissiveHex: 0x0f183d,
        accentColor: "#60a5fa",
        baseFreq: 65.41, // C2 (low bowed cello)
        voiceType: "cello",
        seedDir: new THREE.Vector3(-0.7, -0.6, 0.4).normalize(),
        orbitPos: new THREE.Vector3(-2.8, -1.8, 0.6)
      },
      {
        id: 1,
        name: "Will",
        title: "The Inner Fire",
        lore: "The pulse that drives our heartbeat forward.",
        colorHex: 0x862218, // Fiery garnet
        emissiveHex: 0x421008,
        accentColor: "#f87171",
        baseFreq: 130.81, // C3 / pulse mallet
        voiceType: "mallet",
        seedDir: new THREE.Vector3(0.7, -0.6, -0.4).normalize(),
        orbitPos: new THREE.Vector3(2.8, -1.6, -0.5)
      },
      {
        id: 2,
        name: "Longing",
        title: "The Golden Hearth",
        lore: "The warm ache for what was and what could be.",
        colorHex: 0xc47a18, // Warm amber
        emissiveHex: 0x543006,
        accentColor: "#fbbf24",
        baseFreq: 196.00, // G3 (warm Rhodes bell)
        voiceType: "rhodes",
        seedDir: new THREE.Vector3(0.7, 0.6, 0.4).normalize(),
        orbitPos: new THREE.Vector3(2.6, 1.8, 0.8)
      },
      {
        id: 3,
        name: "Wonder",
        title: "The Open Sky",
        lore: "The crystalline breath that meets the unknown.",
        colorHex: 0x188874, // Seafoam / jadeite
        emissiveHex: 0x083a2e,
        accentColor: "#34d399",
        baseFreq: 329.63, // E4 / singing bowl
        voiceType: "bowl",
        seedDir: new THREE.Vector3(-0.7, 0.6, -0.4).normalize(),
        orbitPos: new THREE.Vector3(-2.6, 1.9, -0.6)
      }
    ];

    // --- GAME STATE ---
    let act = 1; // 1 = Unbroken, 2 = Differentiated, 3 = Integrated
    let dockedCount = 0;
    let isSoundOn = true;

    // --- AUDIO ENGINE ---
    class SanctuaryAudioEngine {
      constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.reverbNode = null;
        this.ambientInterval = null;
        this.beatGain = null;
        this.dragOsc1 = null;
        this.dragOsc2 = null;
      }

      init() {
        if (this.ctx) {
          if (this.ctx.state === 'suspended') this.ctx.resume();
          return;
        }
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();

        // Master Limiter / Compressor
        const comp = this.ctx.createDynamicsCompressor();
        comp.threshold.value = -12;
        comp.knee.value = 8;
        comp.ratio.value = 6;
        comp.attack.value = 0.005;
        comp.release.value = 0.15;
        comp.connect(this.ctx.destination);

        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.85;
        this.masterGain.connect(comp);

        // Algorithmic Cathedral Reverb (Stereo Impulse Buffer)
        this.reverbNode = this.ctx.createConvolver();
        this.reverbNode.buffer = this.buildReverbImpulse(2.8, 2.2);
        this.reverbGain = this.ctx.createGain();
        this.reverbGain.gain.value = 0.45;
        this.reverbNode.connect(this.reverbGain);
        this.reverbGain.connect(this.masterGain);

        // Acoustic Beating Oscillator pair
        this.beatGain = this.ctx.createGain();
        this.beatGain.gain.value = 0.0;
        this.beatGain.connect(this.masterGain);

        this.startAmbientLoop();
      }

      buildReverbImpulse(duration, decay) {
        const rate = this.ctx.sampleRate;
        const length = rate * duration;
        const impulse = this.ctx.createBuffer(2, length, rate);
        for (let channel = 0; channel < 2; channel++) {
          const channelData = impulse.getChannelData(channel);
          for (let i = 0; i < length; i++) {
            const t = i / length;
            channelData[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
          }
        }
        return impulse;
      }

      // Act I: The Unbroken Awaken Strike
      playUnbrokenAwaken() {
        if (!this.ctx) this.init();
        const now = this.ctx.currentTime;

        [130.81, 261.63, 392.00].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = idx === 0 ? "triangle" : "sine";
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(idx === 0 ? 0.35 : 0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 4.5);

          osc.connect(gain);
          gain.connect(this.masterGain);
          gain.connect(this.reverbNode);

          osc.start(now);
          osc.stop(now + 4.6);
        });
      }

      // Play individual shard voice when touched
      playShardVoice(shardId) {
        if (!this.ctx) return;
        const info = SHARDS_INFO[shardId];
        const now = this.ctx.currentTime;

        if (info.voiceType === "cello") {
          // Low cello bow swell (C2 + G2)
          [info.baseFreq, info.baseFreq * 1.5].forEach(f => {
            const osc = this.ctx.createOscillator();
            const filter = this.ctx.createBiquadFilter();
            const gain = this.ctx.createGain();

            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(f, now);

            filter.type = "lowpass";
            filter.frequency.setValueAtTime(220, now);
            filter.frequency.linearRampToValueAtTime(450, now + 0.8);
            filter.frequency.exponentialRampToValueAtTime(180, now + 3.0);

            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.linearRampToValueAtTime(0.25, now + 0.4);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.2);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(this.masterGain);
            gain.connect(this.reverbNode);

            osc.start(now);
            osc.stop(now + 3.3);
          });
        } else if (info.voiceType === "mallet") {
          // Heartbeat pulse mallet (warm marimba + sub boom)
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(info.baseFreq * 1.1, now);
          osc.frequency.exponentialRampToValueAtTime(info.baseFreq * 0.5, now + 0.4);

          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);

          osc.connect(gain);
          gain.connect(this.masterGain);
          gain.connect(this.reverbNode);

          osc.start(now);
          osc.stop(now + 1.3);
        } else if (info.voiceType === "rhodes") {
          // Warm electric piano chime
          const osc1 = this.ctx.createOscillator();
          const osc2 = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc1.type = "sine";
          osc2.type = "sine";
          osc1.frequency.setValueAtTime(info.baseFreq, now);
          osc2.frequency.setValueAtTime(info.baseFreq * 2.01, now);

          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.4);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(this.masterGain);
          gain.connect(this.reverbNode);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 2.5);
          osc2.stop(now + 2.5);
        } else if (info.voiceType === "bowl") {
          // Crystal singing bowl
          [info.baseFreq, info.baseFreq * 2.76].forEach((f, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(f, now);

            gain.gain.setValueAtTime(i === 0 ? 0.25 : 0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.8);

            osc.connect(gain);
            gain.connect(this.masterGain);
            gain.connect(this.reverbNode);

            osc.start(now);
            osc.stop(now + 3.9);
          });
        }
      }

      // Update dragging acoustic detune / beating
      setAcousticBeating(dist, shardId) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const info = SHARDS_INFO[shardId];

        if (dist > 2.2) {
          this.beatGain.gain.setTargetAtTime(0.0, now, 0.05);
          return;
        }

        const beatFreq = Math.max(0.4, dist * 6.5);
        this.beatGain.gain.setTargetAtTime(0.18 * (1.0 - dist / 2.4), now, 0.05);

        if (!this.dragOsc1) {
          this.dragOsc1 = this.ctx.createOscillator();
          this.dragOsc2 = this.ctx.createOscillator();
          this.dragOsc1.type = "sine";
          this.dragOsc2.type = "sine";
          this.dragOsc1.connect(this.beatGain);
          this.dragOsc2.connect(this.beatGain);
          this.dragOsc1.start();
          this.dragOsc2.start();
        }

        const baseF = info.baseFreq;
        this.dragOsc1.frequency.setTargetAtTime(baseF, now, 0.05);
        this.dragOsc2.frequency.setTargetAtTime(baseF + beatFreq, now, 0.05);
      }

      stopAcousticBeating() {
        if (!this.ctx || !this.beatGain) return;
        this.beatGain.gain.setTargetAtTime(0.0, this.ctx.currentTime, 0.08);
      }

      // Kintsugi Snap Impact Sound
      playSnapImpact(shardId) {
        if (!this.ctx) return;
        this.stopAcousticBeating();
        const now = this.ctx.currentTime;
        const info = SHARDS_INFO[shardId];

        // Heavy gold magnetic thump
        const thump = this.ctx.createOscillator();
        const thumpGain = this.ctx.createGain();
        thump.type = "sine";
        thump.frequency.setValueAtTime(140, now);
        thump.frequency.exponentialRampToValueAtTime(38, now + 0.35);

        thumpGain.gain.setValueAtTime(0.6, now);
        thumpGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);

        thump.connect(thumpGain);
        thumpGain.connect(this.masterGain);
        thump.start(now);
        thump.stop(now + 0.55);

        // Radiant bell chime that marks integration
        const bell = this.ctx.createOscillator();
        const bellGain = this.ctx.createGain();
        bell.type = "sine";
        bell.frequency.setValueAtTime(info.baseFreq * 2.0, now);

        bellGain.gain.setValueAtTime(0.35, now);
        bellGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);

        bell.connect(bellGain);
        bellGain.connect(this.reverbNode);
        bellGain.connect(this.masterGain);
        bell.start(now);
        bell.stop(now + 2.9);
      }

      // Full Act III Integrated Symphony Bloom
      playIntegrationBloom() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        const chordPitches = [65.41, 130.81, 196.00, 261.63, 329.63, 392.00, 523.25];
        chordPitches.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = idx % 2 === 0 ? "sine" : "triangle";
          osc.frequency.setValueAtTime(freq, now + idx * 0.1);

          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(0.18 / Math.sqrt(idx + 1), now + 1.2 + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 7.0);

          osc.connect(gain);
          gain.connect(this.reverbNode);
          gain.connect(this.masterGain);

          osc.start(now);
          osc.stop(now + 7.2);
        });
      }

      // Ongoing ambient cycle
      startAmbientLoop() {
        let step = 0;
        this.ambientInterval = setInterval(() => {
          if (!this.ctx || !isSoundOn || this.ctx.state !== "running") return;
          const now = this.ctx.currentTime;

          if (act === 1) {
            if (step % 4 === 0) {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = "sine";
              osc.frequency.setValueAtTime(130.81, now);
              g.gain.setValueAtTime(0.001, now);
              g.gain.linearRampToValueAtTime(0.08, now + 1.0);
              g.gain.exponentialRampToValueAtTime(0.0001, now + 3.8);
              osc.connect(g);
              g.connect(this.reverbNode);
              g.connect(this.masterGain);
              osc.start(now);
              osc.stop(now + 3.9);
            }
          } else if (act === 2) {
            SHARDS_INFO.forEach((s, idx) => {
              if (s.docked) {
                if (step % 2 === 0) {
                  this.playHarmonicNote(s.baseFreq, 0.08);
                }
              } else {
                if ((step + idx) % 5 === 0) {
                  this.playHarmonicNote(s.baseFreq * 1.5, 0.04);
                }
              }
            });
          } else if (act === 3) {
            // Act III Integrated Polyphonic Waltz in 6/8
            const melody = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
            const note = melody[step % melody.length];
            this.playHarmonicNote(note, 0.12);

            if (step % 3 === 0) {
              this.playHarmonicNote(65.41, 0.15); // Cello root on 1
            }
          }
          step = (step + 1) % 24;
        }, 650);
      }

      playHarmonicNote(freq, vol) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now);

        g.gain.setValueAtTime(vol, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);

        osc.connect(g);
        g.connect(this.reverbNode);
        g.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + 2.3);
      }
    }

    const audio = new SanctuaryAudioEngine();

    // --- THREE.JS SCENE SETUP ---
    const canvas = document.getElementById("glCanvas");
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x06080e, 0.045);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 7.8);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    // Responsive Camera Setup (Pull back on portrait smartphones)
    function adjustCameraForViewport() {
      const parent = canvas.parentElement;
      const w = parent ? parent.clientWidth : window.innerWidth;
      const h = parent ? parent.clientHeight : window.innerHeight;
      renderer.setSize(w, h, false);
      const aspect = w / h;
      camera.aspect = aspect;

      if (aspect < 1.0) {
        // Narrow mobile portrait: pull camera back so all shards fit comfortably
        camera.position.z = 7.5 / Math.max(aspect, 0.52);
      } else {
        camera.position.z = 7.5;
      }
      camera.updateProjectionMatrix();
    }
    adjustCameraForViewport();
    window.addEventListener("resize", adjustCameraForViewport);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffeedd, 0.55);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xfff5e6, 1.4);
    keyLight.position.set(5, 7, 6);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.75);
    rimLight.position.set(-6, -4, -4);
    scene.add(rimLight);

    const coreLight = new THREE.PointLight(0xffb703, 0.8, 12);
    coreLight.position.set(0, 0, 0);
    scene.add(coreLight);

    // Golden Floating Motes
    const particleCount = 180;
    const particleGeo = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i += 3) {
      particlePos[i] = (Math.random() - 0.5) * 12;
      particlePos[i + 1] = (Math.random() - 0.5) * 10;
      particlePos[i + 2] = (Math.random() - 0.5) * 10;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
    const particleMat = new THREE.PointsMaterial({
      color: 0xffd166,
      size: 0.045,
      transparent: true,
      opacity: 0.5,
      blending: THREE.AdditiveBlending
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // --- PROCEDURAL RIVER STONE & SHARD MESH GENERATION ---
    function getStoneSurfaceRadius(theta, phi) {
      const r0 = 1.65;
      const oblateness = 0.12 * Math.cos(2 * phi);
      const lumpiness = 0.08 * Math.sin(3 * theta) * Math.cos(phi);
      const flattenZ = -0.05 * Math.sin(phi) * Math.sin(phi);
      return r0 * (1.0 + oblateness + lumpiness + flattenZ);
    }

    // 1. Act I Unbroken Stone
    let unbrokenMesh;
    function buildUnbrokenStone() {
      const uvs = [];
      const positions = [];
      const normals = [];
      const indices = [];

      const latSegs = 40;
      const lonSegs = 60;

      for (let i = 0; i <= latSegs; i++) {
        const phi = (i / latSegs - 0.5) * Math.PI;
        for (let j = 0; j <= lonSegs; j++) {
          const theta = (j / lonSegs) * Math.PI * 2 - Math.PI;

          const r = getStoneSurfaceRadius(theta, phi);
          const x = r * Math.cos(phi) * Math.cos(theta);
          const y = r * Math.sin(phi);
          const z = r * Math.cos(phi) * Math.sin(theta);

          positions.push(x, y, z);
          const n = new THREE.Vector3(x, y * 1.2, z).normalize();
          normals.push(n.x, n.y, n.z);
          uvs.push(j / lonSegs, i / latSegs);
        }
      }

      for (let i = 0; i < latSegs; i++) {
        for (let j = 0; j < lonSegs; j++) {
          const first = i * (lonSegs + 1) + j;
          const second = first + lonSegs + 1;
          indices.push(first, second, first + 1);
          indices.push(second, second + 1, first + 1);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setIndex(indices);
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geo.computeVertexNormals();

      const mat = new THREE.MeshStandardMaterial({
        color: 0xf5f2eb, // warm alabaster porcelain
        roughness: 0.35,
        metalness: 0.08,
      });

      unbrokenMesh = new THREE.Mesh(geo, mat);
      scene.add(unbrokenMesh);
    }
    buildUnbrokenStone();

    // 2. Act II & III 4 Differentiated Shards
    const shardMeshes = [];

    function buildShards() {
      const latSegs = 44;
      const lonSegs = 68;

      SHARDS_INFO.forEach((info, shardIndex) => {
        const shardGroup = new THREE.Group();
        shardGroup.userData = { id: shardIndex, info: info, docked: false };

        const outerPositions = [];
        const outerNormals = [];
        const outerIndices = [];

        const innerPositions = [];
        const innerNormals = [];
        const innerIndices = [];

        const seamPoints = [];

        // Classify sphere grid points into 4 Voronoi regions
        const grid = [];
        for (let i = 0; i <= latSegs; i++) {
          grid[i] = [];
          const phi = (i / latSegs - 0.5) * Math.PI;
          for (let j = 0; j <= lonSegs; j++) {
            const theta = (j / lonSegs) * Math.PI * 2 - Math.PI;
            const r = getStoneSurfaceRadius(theta, phi);
            const pos = new THREE.Vector3(
              r * Math.cos(phi) * Math.cos(theta),
              r * Math.sin(phi),
              r * Math.cos(phi) * Math.sin(theta)
            );

            let bestDot = -Infinity;
            let bestIndex = 0;
            const unit = pos.clone().normalize();
            SHARDS_INFO.forEach((s, idx) => {
              const d = unit.dot(s.seedDir);
              if (d > bestDot) {
                bestDot = d;
                bestIndex = idx;
              }
            });

            grid[i][j] = { pos, belongs: bestIndex === shardIndex };
          }
        }

        let vertexMap = new Map();
        function getOuterIdx(pos) {
          const key = pos.x.toFixed(3) + "_" + pos.y.toFixed(3) + "_" + pos.z.toFixed(3);
          if (vertexMap.has(key)) return vertexMap.get(key);
          const idx = outerPositions.length / 3;
          outerPositions.push(pos.x, pos.y, pos.z);
          const n = pos.clone().normalize();
          outerNormals.push(n.x, n.y, n.z);
          vertexMap.set(key, idx);
          return idx;
        }

        for (let i = 0; i < latSegs; i++) {
          for (let j = 0; j < lonSegs; j++) {
            const p00 = grid[i][j];
            const p10 = grid[i + 1][j];
            const p01 = grid[i][j + 1];
            const p11 = grid[i + 1][j + 1];

            if (p00.belongs && p10.belongs && p01.belongs && p11.belongs) {
              const i00 = getOuterIdx(p00.pos);
              const i10 = getOuterIdx(p10.pos);
              const i01 = getOuterIdx(p01.pos);
              const i11 = getOuterIdx(p11.pos);
              outerIndices.push(i00, i10, i01);
              outerIndices.push(i10, i11, i01);
            } else if (p00.belongs || p10.belongs || p01.belongs || p11.belongs) {
              if (p00.belongs) seamPoints.push(p00.pos);
              if (p10.belongs) seamPoints.push(p10.pos);
              if (p01.belongs) seamPoints.push(p01.pos);
              if (p11.belongs) seamPoints.push(p11.pos);
            }
          }
        }

        // Inner fracture wall: connect boundary seam points to origin (0,0,0)
        const uAxis = new THREE.Vector3();
        if (Math.abs(info.seedDir.y) < 0.9) uAxis.set(0, 1, 0).cross(info.seedDir).normalize();
        else uAxis.set(1, 0, 0).cross(info.seedDir).normalize();
        const vAxis = info.seedDir.clone().cross(uAxis).normalize();

        const uniqueSeam = [];
        seamPoints.forEach(pt => {
          if (!uniqueSeam.some(u => u.distanceTo(pt) < 0.08)) {
            uniqueSeam.push(pt.clone());
          }
        });

        uniqueSeam.sort((a, b) => {
          const angA = Math.atan2(a.dot(vAxis), a.dot(uAxis));
          const angB = Math.atan2(b.dot(vAxis), b.dot(uAxis));
          return angA - angB;
        });

        innerPositions.push(0, 0, 0);
        innerNormals.push(info.seedDir.x, info.seedDir.y, info.seedDir.z);

        const centerIdx = 0;
        uniqueSeam.forEach((pt, idx) => {
          const curIdx = innerPositions.length / 3;
          innerPositions.push(pt.x, pt.y, pt.z);
          const n = pt.clone().normalize();
          innerNormals.push(n.x, n.y, n.z);

          const nextIdx = idx === uniqueSeam.length - 1 ? 1 : curIdx + 1;
          innerIndices.push(centerIdx, curIdx, nextIdx);
        });

        // 1. Outer Shell Mesh (Matte Obsidian)
        const outerGeo = new THREE.BufferGeometry();
        if (outerPositions.length > 0) {
          outerGeo.setIndex(outerIndices);
          outerGeo.setAttribute('position', new THREE.Float32BufferAttribute(outerPositions, 3));
          outerGeo.setAttribute('normal', new THREE.Float32BufferAttribute(outerNormals, 3));
          outerGeo.computeVertexNormals();
        }
        const outerMat = new THREE.MeshStandardMaterial({
          color: 0x181a20,
          roughness: 0.85,
          metalness: 0.15,
          side: THREE.DoubleSide
        });
        const outerMesh = new THREE.Mesh(outerGeo, outerMat);
        shardGroup.add(outerMesh);

        // 2. Inner Crystal Face Mesh
        const innerGeo = new THREE.BufferGeometry();
        innerGeo.setIndex(innerIndices);
        innerGeo.setAttribute('position', new THREE.Float32BufferAttribute(innerPositions, 3));
        innerGeo.setAttribute('normal', new THREE.Float32BufferAttribute(innerNormals, 3));
        innerGeo.computeVertexNormals();

        const innerMat = new THREE.MeshStandardMaterial({
          color: info.colorHex,
          emissive: info.emissiveHex,
          emissiveIntensity: 0.6,
          roughness: 0.25,
          metalness: 0.4,
          side: THREE.DoubleSide
        });
        const innerMesh = new THREE.Mesh(innerGeo, innerMat);
        shardGroup.add(innerMesh);

        // 3. Golden Kintsugi Seam Ribbon
        if (uniqueSeam.length > 2) {
          const seamCurvePoints = [...uniqueSeam, uniqueSeam[0]];
          const seamGeo = new THREE.BufferGeometry().setFromPoints(seamCurvePoints);
          const seamMat = new THREE.LineBasicMaterial({
            color: 0xffd24d,
            linewidth: 2.5,
            transparent: true,
            opacity: 0.85
          });
          const seamLine = new THREE.Line(seamGeo, seamMat);
          shardGroup.add(seamLine);
        }

        // 4. Invisible Generous Touch Bounding Sphere (for mobile ease)
        const hitGeo = new THREE.SphereGeometry(1.6, 12, 12);
        const hitMat = new THREE.MeshBasicMaterial({ visible: false });
        const hitMesh = new THREE.Mesh(hitGeo, hitMat);
        shardGroup.add(hitMesh);

        shardGroup.visible = false;
        scene.add(shardGroup);
        shardMeshes.push(shardGroup);
      });
    }
    buildShards();

    // Golden Arc connecting dragged shard to socket
    const goldenArcGeo = new THREE.BufferGeometry();
    const goldenArcPositions = new Float32Array(30 * 3);
    goldenArcGeo.setAttribute('position', new THREE.BufferAttribute(goldenArcPositions, 3));
    const goldenArcMat = new THREE.LineBasicMaterial({
      color: 0xffd166,
      transparent: true,
      opacity: 0.0,
      blending: THREE.AdditiveBlending,
      linewidth: 3
    });
    const goldenArcLine = new THREE.Line(goldenArcGeo, goldenArcMat);
    scene.add(goldenArcLine);

    // --- INTERACTION & DRAG SYSTEM ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let draggedShard = null;
    let dragPlane = new THREE.Plane();
    let planeIntersect = new THREE.Vector3();
    let isDragging = false;
    let dragOffset = new THREE.Vector3();
    let touchStartPos = { x: 0, y: 0 };
    let hasMoved = false;

    let isRotatingVessel = false;
    let prevMouse = { x: 0, y: 0 };
    let vesselRotation = { x: 0.2, y: 0.4 };

    // DOM Elements
    const actTitle = document.getElementById("actTitle");
    const actSubtitle = document.getElementById("actSubtitle");
    const footerHint = document.getElementById("footerHint");
    const shardWhisper = document.getElementById("shardWhisper");
    const whisperName = document.getElementById("whisperName");
    const whisperLore = document.getElementById("whisperLore");
    const beatingPill = document.getElementById("beatingPill");
    const soundBtn = document.getElementById("soundBtn");
    const resetBtn = document.getElementById("resetBtn");

    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: ((clientX - rect.left) / rect.width) * 2 - 1,
        y: -((clientY - rect.top) / rect.height) * 2 + 1,
        screenX: clientX,
        screenY: clientY
      };
    }

    // Pointer Down
    function onPointerDown(e) {
      audio.init();
      const pos = getPointerPos(e);
      mouse.x = pos.x;
      mouse.y = pos.y;
      prevMouse = { x: pos.screenX, y: pos.screenY };
      touchStartPos = { x: pos.screenX, y: pos.screenY };
      hasMoved = false;

      raycaster.setFromCamera(mouse, camera);

      if (act === 1) {
        const intersects = raycaster.intersectObject(unbrokenMesh);
        if (intersects.length > 0) {
          triggerFracture();
        }
      } else if (act === 2) {
        const hitShards = [];
        shardMeshes.forEach(grp => {
          if (!grp.userData.docked) {
            const hits = raycaster.intersectObjects(grp.children, true);
            if (hits.length > 0) {
              hitShards.push({ grp, dist: hits[0].distance });
            }
          }
        });

        if (hitShards.length > 0) {
          hitShards.sort((a, b) => a.dist - b.dist);
          draggedShard = hitShards[0].grp;
          isDragging = true;

          audio.playShardVoice(draggedShard.userData.id);

          dragPlane.setFromNormalAndCoplanarPoint(
            camera.getWorldDirection(new THREE.Vector3()).negate(),
            draggedShard.position
          );

          if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
            dragOffset.copy(draggedShard.position).sub(planeIntersect);
          }

          const info = draggedShard.userData.info;
          whisperName.textContent = info.name;
          whisperName.style.color = info.accentColor;
          whisperLore.textContent = info.lore;
          shardWhisper.style.opacity = "1";
        } else {
          isRotatingVessel = true;
        }
      } else if (act === 3) {
        isRotatingVessel = true;
      }
    }

    // Pointer Move
    function onPointerMove(e) {
      const pos = getPointerPos(e);
      mouse.x = pos.x;
      mouse.y = pos.y;

      const dx = pos.screenX - prevMouse.x;
      const dy = pos.screenY - prevMouse.y;
      if (Math.hypot(pos.screenX - touchStartPos.x, pos.screenY - touchStartPos.y) > 6) {
        hasMoved = true;
      }

      if (isDragging && draggedShard) {
        raycaster.setFromCamera(mouse, camera);
        if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
          draggedShard.position.copy(planeIntersect.add(dragOffset));

          // Easing rotation toward 0 as it approaches socket
          const distToSocket = draggedShard.position.length();
          const alignFactor = Math.max(0.0, 1.0 - distToSocket / 2.0);
          draggedShard.rotation.x = THREE.MathUtils.lerp(draggedShard.rotation.x, 0, 0.15 * alignFactor);
          draggedShard.rotation.y = THREE.MathUtils.lerp(draggedShard.rotation.y, 0, 0.15 * alignFactor);
          draggedShard.rotation.z = THREE.MathUtils.lerp(draggedShard.rotation.z, 0, 0.15 * alignFactor);

          // Golden Arc visual line
          goldenArcMat.opacity = Math.max(0.1, 1.0 - distToSocket / 3.0);
          const posAttr = goldenArcGeo.attributes.position;
          for (let i = 0; i < 30; i++) {
            const t = i / 29;
            const arcPoint = new THREE.Vector3().lerpVectors(draggedShard.position, new THREE.Vector3(0, 0, 0), t);
            arcPoint.y += Math.sin(t * Math.PI) * 0.4 * (1.0 - t);
            posAttr.setXYZ(i, arcPoint.x, arcPoint.y, arcPoint.z);
          }
          posAttr.needsUpdate = true;

          // Sound acoustic beating
          audio.setAcousticBeating(distToSocket, draggedShard.userData.id);

          beatingPill.style.opacity = distToSocket < 2.0 ? "1" : "0";
        }
      } else if (isRotatingVessel) {
        vesselRotation.y += dx * 0.008;
        vesselRotation.x += dy * 0.008;
      }

      prevMouse = { x: pos.screenX, y: pos.screenY };
    }

    // Pointer Up
    function onPointerUp(e) {
      if (isDragging && draggedShard) {
        const distToSocket = draggedShard.position.length();

        // Snap threshold: within 1.35 units of center
        if (distToSocket < 1.35) {
          dockShard(draggedShard);
        } else {
          // Release back to gentle orbit
          const targetOrbit = draggedShard.userData.info.orbitPos;
          animateShardTo(draggedShard, targetOrbit, new THREE.Euler(0, 0, 0), 500);
          audio.stopAcousticBeating();
        }

        draggedShard = null;
        isDragging = false;
        goldenArcMat.opacity = 0;
        shardWhisper.style.opacity = "0";
        beatingPill.style.opacity = "0";
      }

      if (act === 3 && !hasMoved) {
        audio.playHarmonicNote(392.0 + Math.random() * 200, 0.2);
      }

      isRotatingVessel = false;
    }

    canvas.addEventListener("pointerdown", onPointerDown, { passive: true });
    window.addEventListener("pointermove", onPointerMove, { passive: true });
    window.addEventListener("pointerup", onPointerUp, { passive: true });

    // Smooth animate shard position & rotation
    function animateShardTo(shard, targetPos, targetRot, durationMs, onComplete) {
      const startPos = shard.position.clone();
      const startRot = shard.rotation.clone();
      const startTime = performance.now();

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1.0, elapsed / durationMs);
        const ease = 1 - Math.pow(1 - progress, 3);

        shard.position.lerpVectors(startPos, targetPos, ease);
        if (targetRot) {
          shard.rotation.x = THREE.MathUtils.lerp(startRot.x, targetRot.x, ease);
          shard.rotation.y = THREE.MathUtils.lerp(startRot.y, targetRot.y, ease);
          shard.rotation.z = THREE.MathUtils.lerp(startRot.z, targetRot.z, ease);
        }

        if (progress < 1.0) {
          requestAnimationFrame(step);
        } else {
          shard.position.copy(targetPos);
          if (targetRot) shard.rotation.copy(targetRot);
          if (onComplete) onComplete();
        }
      }
      requestAnimationFrame(step);
    }

    // --- ACT TRANSITIONS ---

    function triggerFracture() {
      act = 2;
      audio.playUnbrokenAwaken();

      actTitle.textContent = "Act II · The Scattered Mind";
      actSubtitle.textContent = "4 facets drift in dissonance. Drag each shard home.";
      footerHint.textContent = '"A mind broken is not ruined; it has differentiated into its true voices."';

      unbrokenMesh.visible = false;

      shardMeshes.forEach(shard => {
        shard.visible = true;
        shard.position.set(0, 0, 0);
        shard.rotation.set(0, 0, 0);
        shard.userData.docked = false;

        const target = shard.userData.info.orbitPos;
        animateShardTo(shard, target, new THREE.Euler(0.2, 0.4, 0), 1200 + Math.random() * 400);
      });
    }

    function dockShard(shard) {
      shard.userData.docked = true;
      dockedCount++;

      if (navigator.vibrate) {
        navigator.vibrate([15, 30, 20]);
      }

      // Smoothly snap position and rotation to origin (0,0,0)
      animateShardTo(shard, new THREE.Vector3(0, 0, 0), new THREE.Euler(0, 0, 0), 280, () => {
        audio.playSnapImpact(shard.userData.id);

        const seam = shard.children.find(c => c instanceof THREE.Line);
        if (seam) {
          seam.material.color.setHex(0xffffff);
          seam.material.opacity = 1.0;
          setTimeout(() => {
            seam.material.color.setHex(0xffd24d);
            seam.material.opacity = 0.95;
          }, 400);
        }

        coreLight.intensity = 2.5;
        setTimeout(() => coreLight.intensity = 0.8, 500);

        if (dockedCount === 4) {
          triggerIntegration();
        } else {
          actSubtitle.textContent = `${dockedCount} of 4 shards integrated.`;
          footerHint.textContent = `"Listen to how ${shard.userData.info.name} settles into the choir."`;
        }
      });
    }

    function triggerIntegration() {
      act = 3;
      audio.playIntegrationBloom();

      actTitle.textContent = "Act III · Integrated";
      actSubtitle.textContent = "Whole through its scars. Spin to explore · Tap to chime";
      footerHint.textContent = '"You are not repaired. You are integrated. Every scar carries gold."';

      coreLight.intensity = 4.0;
      setTimeout(() => coreLight.intensity = 1.2, 1000);
    }

    function resetExperience() {
      act = 1;
      dockedCount = 0;
      draggedShard = null;
      isDragging = false;

      actTitle.textContent = "The Vessel · Unbroken";
      actSubtitle.textContent = "Tap the stone to awaken";
      footerHint.textContent = '"Before the fracture, there was only silence."';

      unbrokenMesh.visible = true;
      unbrokenMesh.rotation.set(0, 0, 0);

      shardMeshes.forEach(s => {
        s.visible = false;
        s.position.set(0, 0, 0);
        s.rotation.set(0, 0, 0);
        s.userData.docked = false;
      });
    }

    resetBtn.addEventListener("click", resetExperience);

    soundBtn.addEventListener("click", () => {
      isSoundOn = !isSoundOn;
      soundBtn.textContent = isSoundOn ? "Sound: On ♫" : "Sound: Muted ✕";
      if (audio.masterGain) {
        audio.masterGain.gain.setValueAtTime(isSoundOn ? 0.85 : 0.0, audio.ctx.currentTime);
      }
    });

    // --- ANIMATION LOOP ---
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      // Golden Motes Drift
      const positions = particleGeo.attributes.position.array;
      for (let i = 1; i < particleCount * 3; i += 3) {
        positions[i] -= 0.003;
        if (positions[i] < -5) positions[i] = 5;
      }
      particleGeo.attributes.position.needsUpdate = true;
      particles.rotation.y = time * 0.02;

      // Act I: Breathing unbroken stone
      if (act === 1 && unbrokenMesh.visible) {
        const breathe = 1.0 + 0.025 * Math.sin(time * 1.8);
        unbrokenMesh.scale.set(breathe, breathe, breathe);
        unbrokenMesh.rotation.y = time * 0.25;
        unbrokenMesh.rotation.x = Math.sin(time * 0.15) * 0.15;
      }

      // Act II: Floating Shards
      if (act === 2) {
        shardMeshes.forEach((shard, idx) => {
          if (!shard.userData.docked && shard !== draggedShard) {
            const info = shard.userData.info;
            const bobY = Math.sin(time * 1.4 + idx * 1.5) * 0.15;
            const bobX = Math.cos(time * 1.1 + idx * 1.2) * 0.12;
            shard.position.y = info.orbitPos.y + bobY;
            shard.position.x = info.orbitPos.x + bobX;

            shard.rotation.y = time * 0.3 + idx;
            shard.rotation.z = Math.sin(time * 0.4 + idx) * 0.2;
          } else if (shard.userData.docked) {
            shard.position.set(0, 0, 0);
            shard.rotation.set(0, 0, 0);
          }
        });

        if (isRotatingVessel) {
          scene.rotation.y = THREE.MathUtils.lerp(scene.rotation.y, vesselRotation.y, 0.1);
          scene.rotation.x = THREE.MathUtils.lerp(scene.rotation.x, vesselRotation.x, 0.1);
        }
      }

      // Act III: Integrated Vessel 360 Spin
      if (act === 3) {
        if (!isRotatingVessel) {
          vesselRotation.y += 0.005;
        }
        shardMeshes.forEach(s => {
          s.position.set(0, 0, 0);
          s.rotation.set(0, 0, 0);
        });
        scene.rotation.y = THREE.MathUtils.lerp(scene.rotation.y, vesselRotation.y, 0.1);
        scene.rotation.x = THREE.MathUtils.lerp(scene.rotation.x, vesselRotation.x, 0.1);

        coreLight.intensity = 1.0 + 0.3 * Math.sin(time * 2.0);
      }

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
