<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Dating Sim | Evan Swope</title>
  
  <link rel="stylesheet" href="synth.css">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Share+Tech+Mono&family=Outfit:wght@300;400;600;800&family=VT323&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --game-bg: #111;
      --game-border: #33ff33;
      --game-text: #33ff33;
      --game-error: #ff3333;
      --game-highlight: #ff00ff;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      margin: 0;
      overflow-x: hidden;
    }

    .game-container {
      max-width: 1000px;
      margin: 100px auto 40px;
      padding: 1rem;
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 1rem;
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
    }

    @media (max-width: 768px) {
      .game-container {
        grid-template-columns: 1fr;
      }
    }

    /* Stats Bar */
    .game-stats {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      background: var(--game-bg);
      border: 2px solid var(--game-border);
      padding: 1rem;
      color: var(--game-text);
      box-shadow: 0 0 10px rgba(51, 255, 51, 0.2);
    }
    
    .stat-box {
      text-align: center;
    }
    
    .stat-label {
      font-size: 0.9rem;
      opacity: 0.8;
      text-transform: uppercase;
    }
    
    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
    }

    /* Text Log / MUD area */
    .game-console {
      background: var(--game-bg);
      border: 2px solid var(--game-border);
      display: flex;
      flex-direction: column;
      height: 500px;
      box-shadow: 0 0 10px rgba(51, 255, 51, 0.2);
    }

    .log-area {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .log-msg {
      margin: 0;
      line-height: 1.4;
    }

    .log-gm { color: var(--game-text); }
    .log-customer { color: var(--game-highlight); font-weight: bold; }
    .log-user { color: #fff; opacity: 0.8; }
    .log-system { color: #888; font-style: italic; }
    .log-error { color: var(--game-error); }

    .input-area {
      display: flex;
      border-top: 2px solid var(--game-border);
      padding: 0.5rem;
      background: #0a0a0a;
    }

    .input-area > span {
      color: var(--game-border);
      padding: 0.5rem;
    }

    #game-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
      outline: none;
      padding: 0.5rem;
    }

    /* Image Display Area */
    .game-vision {
      background: var(--game-bg);
      border: 2px solid var(--game-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      box-shadow: 0 0 10px rgba(51, 255, 51, 0.2);
    }

    .canvas-container {
      width: 250px;
      height: 250px;
      background: #000;
      border: 1px solid #444;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      margin-bottom: 1rem;
      overflow: hidden;
    }

    .canvas-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff; /* standard white background for product */
    }

    #loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--game-border);
      flex-direction: column;
      gap: 0.5rem;
      display: none;
    }

    .status-text {
      color: #aaa;
      font-size: 1rem;
      text-align: center;
      margin-top: 1rem;
    }

    /* Floating Particles for effects */
    .particle {
      position: fixed;
      pointer-events: none;
      font-size: 2rem;
      animation: floatUp 2s ease-out forwards;
      z-index: 9999;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
    }

  </style>
</head>
<body>

  <!-- Nav (Reused) -->
  <nav class="synth-nav">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <img src="https://ui-avatars.com/api/?name=E+S&background=0D8ABC&color=fff&rounded=true&bold=true" alt="Logo">
        <span class="nav-title" style="font-family: 'Permanent Marker', cursive;">EVAN SWOPE</span>
      </a>
      <div class="nav-links">
        <a href="index.html">HOME</a>
        <a href="experiments.html">AI LAB</a>
        <a href="grocery-dating-sim.html" class="active">GROCERY SIM</a>
        <a href="#" id="btn-leaderboard" style="color: gold;"><i class="fa-solid fa-trophy"></i> LEADERBOARD</a>
        <a href="mailto:hello@evanswope.com" class="nav-btn">CONTACT</a>
      </div>
    </div>
  </nav>

  <!-- Leaderboard Modal -->
  <div id="leaderboard-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:var(--game-bg); border:2px solid gold; padding:2rem; width:90%; max-width:600px; max-height:80vh; overflow-y:auto; box-shadow:0 0 20px rgba(255,215,0,0.3); font-family: 'VT323', monospace;">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid gold; padding-bottom:1rem; margin-bottom:1rem;">
        <h2 style="color:gold; margin:0; font-size:2rem;"><i class="fa-solid fa-trophy"></i> HALL OF ROMANCE</h2>
        <button id="btn-close-leaderboard" style="background:transparent; border:none; color:gold; font-size:2rem; cursor:pointer;">&times;</button>
      </div>
      <div id="leaderboard-content" style="color:var(--text-light); font-size:1.2rem;">
        <div style="text-align:center; padding:2rem;"><i class="fa-solid fa-spinner fa-spin"></i> Loading legends...</div>
      </div>
    </div>
  </div>

  <!-- Image Viewer Modal -->
  <div id="image-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:10000; justify-content:center; align-items:center; cursor:pointer;">
    <div style="position:relative; background:#000; border:2px solid gold; padding:10px; box-shadow:0 0 30px rgba(255,215,0,0.5); cursor:default;" id="image-modal-content">
      <button id="btn-close-image" style="position:absolute; top:-15px; right:-15px; background:#000; border:2px solid gold; color:gold; font-size:1.5rem; width:35px; height:35px; border-radius:50%; cursor:pointer; display:flex; justify-content:center; align-items:center;">&times;</button>
      <img id="image-modal-img" src="" style="display:block; max-width:100%; max-height:80vh; object-fit:contain;" crossorigin="anonymous" />
    </div>
  </div>

  <div class="game-container">
    
    <div class="game-stats">
      <div class="stat-box">
        <div class="stat-label">Level</div>
        <div class="stat-value" id="stat-level">1</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Cash</div>
        <div class="stat-value" style="color: #4CAF50;">$<span id="stat-cash">0</span></div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Trust</div>
        <div class="stat-value" id="stat-trust">50%</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Popularity</div>
        <div class="stat-value" id="stat-pop">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Affection</div>
        <div class="stat-value" style="color: #ff7eb3;"><span id="stat-affection">0</span><i class="fa-solid fa-heart" style="font-size:1rem;margin-left:5px;"></i></div>
      </div>
    </div>

    <div class="game-console">
      <div class="log-area" id="log-area">
        <p class="log-system">LOADING GROCERY DATING SIM v1.0...</p>
        <p class="log-system">CONNECTING TO NEURAL NET...</p>
        <p class="log-system">SUCCESS. TYPE "START" TO BEGIN SHIFT.</p>
      </div>
      <div class="input-area">
        <span>></span>
        <input type="text" id="game-input" placeholder="Type here..." autocomplete="off">
      </div>
    </div>

    <div class="game-vision">
      <h3 style="margin:0 0 1rem 0; color:var(--game-text); border-bottom: 1px solid var(--game-text); padding-bottom: 0.5rem; width: 100%; text-align: center; font-family: 'VT323', monospace;">THE SCANNER</h3>
      <div class="canvas-container">
        <img id="item-image" src="" style="display:none;" crossorigin="anonymous" />
        <div id="loading-overlay">
          <i class="fa-solid fa-spinner fa-spin" style="font-size:2rem;"></i>
          <span id="loading-text">GENERATING...</span>
        </div>
      </div>
      <div class="status-text" id="scanner-status">WAITING FOR ITEM...</div>
    </div>

  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getDatabase, ref, push, query, orderByChild, limitToLast, get } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
    import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB2I4nMihPDLIANp-3p2e_sjLg04YFdKoA",
      authDomain: "grocery-sim.firebaseapp.com",
      projectId: "grocery-sim",
      storageBucket: "grocery-sim.firebasestorage.app",
      messagingSenderId: "744813705956",
      appId: "1:744813705956:web:568f0f42ed49aa639d4af1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);

    window.FirebaseAPI = { db, storage, ref, push, query, orderByChild, limitToLast, get, storageRef, uploadBytes, getDownloadURL };
  </script>

  <script src="grocery-game.js"></script>
</body>
</html>
