<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wavetable Synth</title>
    <!-- Use similar fonts as portfolio -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
      // Intercept AudioContext to allow external suspension
      let globalAudioCtx = null;
      const OriginalAudioContext = window.AudioContext || window.webkitAudioContext;
      if (OriginalAudioContext) {
        window.AudioContext = function(...args) {
          globalAudioCtx = new OriginalAudioContext(...args);
          return globalAudioCtx;
        };
        window.webkitAudioContext = window.AudioContext;
      }

      // Listen for suspend/resume from parent carousel
      window.addEventListener('message', (e) => {
        if (e.data === 'suspend' && globalAudioCtx && globalAudioCtx.state === 'running') {
          globalAudioCtx.suspend();
        } else if (e.data === 'resume' && globalAudioCtx && globalAudioCtx.state === 'suspended') {
          globalAudioCtx.resume();
        }
      });

      // Also suspend if user switches tabs
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && globalAudioCtx && globalAudioCtx.state === 'running') {
          globalAudioCtx.suspend();
        }
      });

      // Swipe Detection to send to parent
      let touchStartX = 0;
      let touchEndX = 0;
      document.addEventListener('touchstart', e => {
        // Disable swipe if interacting with input or canvas
        if (e.target.tagName.toLowerCase() === 'input' || e.target.tagName.toLowerCase() === 'canvas') return;
        touchStartX = e.changedTouches[0].screenX;
      }, {passive: true});

      document.addEventListener('touchend', e => {
        if (e.target.tagName.toLowerCase() === 'input' || e.target.tagName.toLowerCase() === 'canvas') return;
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      }, {passive: true});

      function handleSwipe() {
        const threshold = 50;
        if (touchEndX < touchStartX - threshold) {
          window.parent.postMessage({ type: 'SWIPE', direction: 'left' }, '*');
        }
        if (touchEndX > touchStartX + threshold) {
          window.parent.postMessage({ type: 'SWIPE', direction: 'right' }, '*');
        }
      }
    </script>
    <script type="module" crossorigin src="../wavetable-synth/assets/index-BpRlw-fK.js"></script>
    <link rel="stylesheet" crossorigin href="../wavetable-synth/assets/index-BCDCReIb.css">
    <link rel="stylesheet" href="../synth.css">
    <style>
      .audio-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 998;
        background: rgba(10, 10, 26, 0.95);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
      }
      
      /* Vertical Layout Condensation Overrides */
      .synth-card { padding: 1.25rem !important; }
      .canvas-container { margin-bottom: 1rem !important; }
      .controls { margin-bottom: 1rem !important; }
      .slider-group { padding: 0.25rem 0.5rem !important; gap: 0.5rem !important; }
      .sliders { gap: 0.5rem !important; }
      .keyboard-container { height: 120px !important; }
      
      @media (max-width: 768px) {
        .synth-card { padding: 0.9rem !important; }
        .canvas-container { margin-bottom: 0.25rem !important; }
        .controls { margin-bottom: 0.25rem !important; }
        .slider-group { padding: 0.15rem 0.25rem !important; gap: 0.25rem !important; }
        .slider-group span { font-size: 0.75rem !important; }
        input[type="range"] { height: 2px !important; margin: 2px 0 !important; }
        input[type="range"]::-webkit-slider-thumb { width: 12px !important; height: 12px !important; }
        .keyboard-container { height: 75px !important; }
        .mode-btn { padding: 0.25rem 0.5rem !important; font-size: 0.7rem !important; border-radius: 4px !important; }
        .mode-selector { margin-bottom: 0.5rem !important; gap: 0.25rem !important; }
      }
      
      .slider-group span i {
        color: #ff7eb3;
      }
    </style>
  </head>
  <body style="padding: 0; min-height: 100%; display: block; background: transparent;">
    <div id="app">
      <div class="generative-card synth-card" style="margin: 0; max-width: none; border: none; box-shadow: none;">
        <div id="audioOverlay" class="card-overlay" style="z-index: 998;">
          <button id="initAudioBtn" class="start-btn large-start">POWER ON <i class="fa-solid fa-power-off"></i></button>
        </div>

        <!-- SVG Scribble Border -->
        <svg class="synth-scribble-outline" preserveAspectRatio="none">
          <rect x="5" y="5" width="calc(100% - 10px)" height="calc(100% - 10px)" rx="10" style="filter: url(#scribble-filter);" />
        </svg>

        <div class="card-header">
          <div class="title-row" style="display: flex; align-items: center; justify-content: center; gap: 1rem;">
            <h2 class="card-title">Waveshaper</h2>
            <div class="power-container">
              <div id="power-indicator" class="power-light"></div>
            </div>
          </div>
          <p class="card-desc">Distort this sine wave with simple math sliders to discover new harmonics. Select between an arpeggiator, chords, or manual play.</p>
        </div>

        <div class="canvas-container">
          <canvas id="waveCanvas" width="800" height="200" style="cursor: default; pointer-events: none;"></canvas>
        </div>

        <div class="controls">
          <div class="sliders">
            <!-- Column 1 -->
            <div class="slider-group">
                <span title="Tension (Amp Skew)"><i class="fa-solid fa-bezier-curve"></i></span>
                <input type="range" id="modTension" min="0" max="100" value="50">
            </div>
            <div class="slider-group">
                <span title="Phase Skew (Sine to Saw)"><i class="fa-regular fa-hand-point-right"></i></span>
                <input type="range" id="modSaw" min="0" max="100" value="50">
            </div>
            <div class="slider-group">
                <span title="Phase Modulation (FM)"><i class="fa-solid fa-asterisk"></i></span>
                <input type="range" id="modPM" min="0" max="100" value="0">
            </div>
            <div class="slider-group">
                <span title="Hard Sync (Formant)"><i class="fa-solid fa-repeat"></i></span>
                <input type="range" id="modSync" min="0" max="100" value="0">
            </div>
            
            <!-- Column 2 -->
            <div class="slider-group">
                <span title="Wavefolding"><i class="fa-solid fa-scissors"></i></span>
                <input type="range" id="modFold" min="0" max="100" value="0">
            </div>
            <div class="slider-group">
                <span title="Harmonic (Octave)"><i class="fa-solid fa-guitar"></i></span>
                <input type="range" id="modHarmonic" min="0" max="100" value="0">
            </div>
            <div class="slider-group">
                <span title="Decimation (Bitcrush)"><i class="fa-solid fa-ghost"></i></span>
                <input type="range" id="modCrush" min="0" max="100" value="0">
            </div>
            <div class="slider-group">
                <span title="Noise"><i class="fa-solid fa-radio"></i></span>
                <input type="range" id="modNoise" min="0" max="100" value="0">
            </div>
          </div>
        </div>
        
        <div class="mode-selector">
           <button id="btnModeManual" class="mode-btn"><i class="fa-solid fa-keyboard"></i> Manual</button>
           <button id="btnModeArp" class="mode-btn active-toggle"><i class="fa-solid fa-music"></i> Auto Arp</button>
           <button id="btnModeChords" class="mode-btn"><i class="fa-solid fa-meteor"></i> Chords</button>
        </div>

        <div class="keyboard-container" id="keyboard">
          <!-- Keys will be injected here via JS based on screen width -->
        </div>
      </div>
    </div>
    
    <!-- SVG Filter for the scribble effect -->
    <svg style="width:0; height:0; position:absolute;" aria-hidden="true">
      <defs>
        <filter id="scribble-filter">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise">
            <animate attributeName="baseFrequency" values="0.04;0.05;0.04" dur="0.2s" repeatCount="indefinite" />
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <linearGradient id="gradient-pink" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff3366" />
          <stop offset="100%" stop-color="#ff00cc" />
        </linearGradient>
      </defs>
    </svg>
    <script>
      // Swipe Logic for Iframe
      let touchStartX = 0;
      let touchEndX = 0;
      document.addEventListener('touchstart', e => {
        if (e.target.tagName.toLowerCase() === 'input') return;
        touchStartX = e.changedTouches[0].screenX;
      }, {passive: true});
      document.addEventListener('touchend', e => {
        if (e.target.tagName.toLowerCase() === 'input') return;
        touchEndX = e.changedTouches[0].screenX;
        const threshold = 50;
        if (touchEndX < touchStartX - threshold) {
          window.parent.postMessage({ type: 'swipe', direction: 'left' }, '*');
        } else if (touchEndX > touchStartX + threshold) {
          window.parent.postMessage({ type: 'swipe', direction: 'right' }, '*');
        }
      }, {passive: true});

      // Power light logic
      document.addEventListener("DOMContentLoaded", () => {
        const initBtn = document.getElementById('initAudioBtn');
        if(initBtn) {
           initBtn.addEventListener('click', () => {
             document.getElementById('power-indicator').classList.add('is-on');
           });
        }
      });
    </script>
  </body>
</html>
